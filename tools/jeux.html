<h1>Tester les petits jeux de la Clairière</h1>
<p>Chaque lien ouvre le jeu tout seul ; il se relance après chaque partie. Monte le son : musique et bruitages.</p>
<div id="out"></div>
<script>
const J=[["fish","La pêche","Gaston"],["shake","Secouer l'arbre","Luciole, Grignote…"],["search","Fouiller les feuilles","Mitaine"],["catch","Attraper","Galette, Noël"],["firefly","La luciole dorée","Luciole"],

document.getElementById("out").innerHTML=J.map(([k,n,w])=>`<a href="../clairiere.html?jeu=${k}">${n}<span>${w}</span></a>`).join("")
