<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6ece4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
.home{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fffaf2;border:2px solid #ead9cc;color:#5b4250;text-decoration:none;font:900 20px/1 system-ui;box-shadow:0 3px 0 #ead9cc;flex:none}</style>
<title>La Clairière · Kitsune Café</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout : une clairière pastel sous la pluie, comme une page de carnet illustré ; carnet et boutique en dessous */
:root{
  --bg:#eef3e6; --dot:#dde9d2; --card:#fffaf2; --card-2:#fbefe0;
  --ink:#5b4250; --ink-soft:#8f7a86; --line:#ead9cc;
  --coral:#f59a8b; --coral-d:#dc7d6e; --peach:#ffe2cf; --mint:#d6ead0; --lav:#e2dcf4; --gold:#f2c75c; --gold-d:#d6a93a; --pink:#f6a5b4;
  --display:"Mochiy Pop One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Zen Maru Gothic","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:26px 26px}
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:46px;height:46px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,27px);margin:0;line-height:1.1;color:var(--ink);text-wrap:balance}
h1 span{color:var(--coral-d)}
.purse{display:flex;gap:8px}
.coin{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 5px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line)}
.coin svg{width:24px;height:24px}

/* scène */
.scene{position:relative;width:100%;max-width:100%;aspect-ratio:3/2;border-radius:28px;overflow:hidden;background:#a9d68f;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 14px 30px rgba(91,66,80,.18);user-select:none;-webkit-user-select:none;transition:background 1.5s}
.scene .bg,#layer,#rain,.grain,.vignette{position:absolute;inset:0;width:100%;height:100%}
#rain,.grain,.vignette{pointer-events:none}
.grain{display:none;background-size:140px 140px}
.vignette{background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(91,66,80,.16))}
.pill{position:absolute;top:10px;background:rgba(255,250,242,.82);backdrop-filter:blur(4px);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;border:2px solid #fff}
.phase{left:10px}
.raintog{right:10px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700}
.slot{position:absolute;transform:translate(-50%,-100%);aspect-ratio:1/1.12;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.slot:focus-visible,.bowl:focus-visible,button:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:16px}
.slot .item{width:100%;display:block}
.slot .fox{position:absolute;bottom:16%;width:96%;left:2%;transform-origin:50% 95%;animation:breathe 3.4s ease-in-out infinite}
.slot .fox.arrive{animation:pop .7s cubic-bezier(.3,1.6,.5,1), breathe 3.4s ease-in-out .7s infinite}
.slot.empty .ring{width:58%;aspect-ratio:1;border:3px dashed rgba(255,255,255,.85);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:clamp(16px,4vw,26px);color:#fff;margin-bottom:10%;background:rgba(255,255,255,.18);transition:transform .2s}
.slot.empty:hover .ring{transform:scale(1.08)}
.tail{animation:wag 2.6s ease-in-out infinite}
.eyes{animation:blink 5s infinite;transform-origin:60px 57px}
.earR{animation:twitch 7s infinite}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(12deg)}96%{transform:rotate(-4deg)}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.97)}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.bowl{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);width:14%;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink)}
.bowl svg{width:72%}
.bowl small{background:rgba(255,250,242,.88);border:2px solid #fff;border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;white-space:nowrap}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff6b0;box-shadow:0 0 10px 4px rgba(255,240,140,.55);animation:fly 6s ease-in-out infinite;pointer-events:none}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(14px,-12px);opacity:1}}
.heart{position:absolute;font-size:20px;color:#f47f9a;pointer-events:none;animation:heart 1.3s ease-out forwards;text-shadow:0 1px 0 #fff}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-70px) scale(.9)}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--ink-soft);font-size:13.5px;margin:0;max-width:52ch}
.btn,.gifts{font-family:var(--body);font-weight:900;border:0;border-radius:999px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.gifts{font-size:15px;background:var(--gold);color:var(--ink);padding:9px 20px;box-shadow:0 4px 0 var(--gold-d);animation:wiggle 2.4s infinite}
.gifts:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.gifts[disabled]{background:var(--card);color:var(--ink-soft);box-shadow:0 4px 0 var(--line);animation:none;cursor:default}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-4deg)}93%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}

/* onglets */
.tabs{display:flex;gap:8px}
.tab{font-family:var(--display);font-size:15px;background:var(--card);border:2px solid var(--line);color:var(--ink-soft);padding:7px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.panel-head p{margin:0;color:var(--ink-soft);font-size:13.5px}
.panel-head strong{color:var(--ink);font-family:var(--display);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;box-shadow:0 4px 0 var(--line)}
.card .pic{background:var(--mint);border-radius:16px;aspect-ratio:1/1;display:grid;place-items:center;padding:6px}
.card .pic.discret{background:var(--peach)}.card .pic.rare{background:var(--lav)}.card .pic.legend{background:#fbecc0}
.card .pic.item{aspect-ratio:4/3;background:var(--card-2)}
.card .pic svg{width:88%;max-height:100%}
.card h3{font-family:var(--display);font-weight:400;font-size:15px;margin:2px 0 0;line-height:1.25}
.card p{margin:0;font-size:12.8px;color:var(--ink-soft)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.price{display:flex;align-items:center;gap:3px;font-weight:900;font-variant-numeric:tabular-nums}
.price svg{width:20px;height:20px}
.btn{font-size:13.5px;padding:6px 14px;background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral-d)}
.btn:disabled{background:#eadfd6;color:#b3a3a8;box-shadow:0 3px 0 #ddd0c6;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.chip{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--mint);color:#4f7148}
.chip.discret{background:var(--peach);color:#a0583a}.chip.rare{background:var(--lav);color:#5e4f9a}.chip.legend{background:#fbe39a;color:#8a6210}
.card.unseen h3{color:#b3a3a8}

.sheet{position:fixed;inset:0;background:rgba(91,66,80,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:80vh;overflow:auto;animation:up .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:400;margin:0 0 4px;font-size:19px}
.sheet .sub{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px}
.opt{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card-2);margin-bottom:8px}
.opt svg.thumb{width:64px;flex:none}
.opt .txt{flex:1;min-width:0}
.opt strong{display:block;font-size:15px}
.opt span{font-size:12.5px;color:var(--ink-soft)}
.sheet .close{margin-top:6px;width:100%;padding:9px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:min(92vw,440px);text-align:center;z-index:30;box-shadow:0 8px 24px rgba(91,66,80,.2);animation:up .3s ease-out}
#game{position:absolute;inset:0}
.ghud{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:10px;background:rgba(255,250,242,.92);border:2px solid #fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:13px;z-index:6;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.gquit{right:10px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;z-index:6;color:var(--ink)}
.hs{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.hobj{display:block;position:relative;z-index:1;transform-origin:50% 100%}
.hobj svg,.hfox svg,.htail svg{display:block;width:100%}
.hfox{position:absolute;left:12%;width:76%;bottom:30%;z-index:0;visibility:hidden}
.hs.found .hfox{visibility:visible;animation:peekup .5s cubic-bezier(.3,1.6,.5,1)}
.hs.missed .hfox{opacity:.8}
.htail{position:absolute;right:-16%;bottom:6%;width:40%;z-index:0;opacity:0;transform-origin:0 100%}
.htail.peek{animation:tailpeek 1.5s ease-in-out}
.hobj.rustle{animation:rustle .6s}
.hs.nope .hobj{animation:nope .35s}
@keyframes peekup{from{transform:translateY(45%)}to{transform:none}}
@keyframes tailpeek{0%{opacity:0;transform:translateX(-40%)}20%{opacity:1;transform:translateX(0) rotate(-10deg)}45%{transform:rotate(8deg)}70%{opacity:1;transform:rotate(-8deg)}100%{opacity:0;transform:translateX(-40%)}}
@keyframes rustle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.03,.97)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
@keyframes nope{0%,100%{translate:0}25%{translate:-6% 0}75%{translate:6% 0}}
.seat{position:absolute;transform:translate(-50%,-100%);width:16%;animation:seatpop .45s cubic-bezier(.3,1.6,.5,1)}
.seat>svg{display:block;width:100%}
.bub{position:absolute;left:50%;bottom:70%;width:56%;transform:translateX(-50%)}
.bub svg{display:block;width:100%}
.bub-ic{position:absolute;left:25%;top:19.5%;width:50%}
.seat.happy{animation:hop .75s ease-out forwards}
.seat.sad{animation:leave .7s ease-in forwards}
@keyframes seatpop{from{opacity:0;transform:translate(-50%,-85%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%)}}
@keyframes hop{0%{transform:translate(-50%,-100%)}30%{transform:translate(-50%,-112%)}60%{transform:translate(-50%,-100%);opacity:1}100%{transform:translate(-50%,-100%);opacity:0}}
@keyframes leave{to{transform:translate(-50%,-90%);opacity:0}}
.tray{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:8px;width:min(94%,520px);z-index:6}
.food{flex:1;min-width:0;background:var(--card);border:2px solid #fff;border-radius:18px;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line);padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;color:var(--ink);touch-action:manipulation;position:relative}
.food span{width:58%;max-width:44px}.food svg{display:block;width:100%}
.food b{font-size:12px;font-weight:900}
.food kbd{position:absolute;top:4px;right:8px;font-family:var(--body);font-size:10px;color:var(--ink-soft)}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line)}
.food.nope{animation:nope .35s}
.gwrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(91,66,80,.28);z-index:7;padding:12px}
.gcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(91,66,80,.25);animation:up .3s ease-out}
.gcard h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px}
.gcard p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft)}
.greward{display:flex;justify-content:center;align-items:center;gap:6px;font-weight:900;font-size:20px;margin-bottom:10px}
.greward svg{width:28px;height:28px}
.gbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:16px;color:var(--ink);text-shadow:0 2px 0 #fff,0 -1px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:floatup 1s ease-out forwards;pointer-events:none;z-index:8}
@keyframes floatup{to{transform:translate(-50%,-180%);opacity:0}}
.play{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.game-btn>span:last-child{min-width:0}
.game-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.game-btn .gb-ic{width:60px;flex:none;background:var(--mint);border-radius:16px;padding:6px}
.game-btn .gb-ic svg{display:block;width:100%}
.game-btn strong{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.game-btn small{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.35}
.game-btn .best{display:block;font-size:11.5px;font-weight:900;color:var(--coral-d);margin-top:3px}
@media (max-width:480px){.play{grid-template-columns:1fr}.ghud{font-size:11px;top:8px;padding:3px 10px;gap:8px}.food b{font-size:10.5px}.food span{width:42%}.food{padding:4px 2px 3px;border-radius:14px}.seat{width:19%}.gcard{padding:12px 14px}.gcard h2{font-size:17px}.gcard p{font-size:12.5px;margin-bottom:8px}}
.zones{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 5px;margin-bottom:-4px}
.zones::-webkit-scrollbar{display:none}
.zt{font-family:var(--display);font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;background:var(--card);border:2px solid var(--line);color:var(--ink);padding:5px 13px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--line);flex:none}
.zt.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #3d2a35}
.zt.locked{color:var(--ink-soft);background:#f3ebe3}
.zt svg{width:13px;height:13px}
.zc{background:var(--coral);color:#fff;border-radius:999px;font-family:var(--body);font-weight:900;font-size:11px;min-width:18px;padding:0 5px;text-align:center}
.zh{font-family:var(--display);font-weight:400;font-size:16px;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.zh small{font-family:var(--body);font-size:12.5px;color:var(--ink-soft);font-weight:700}
.lockcard{width:100%;display:flex;align-items:center;gap:10px;background:#f3ebe3;border:2px dashed var(--line);border-radius:18px;padding:12px 14px;color:var(--ink-soft);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.lockcard svg{width:16px;height:16px;flex:none}
.card.fc{font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:stretch}
.card.fc:hover{transform:translateY(-2px)}
.lvl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);flex-wrap:wrap}
.hs5{color:#f47f9a;letter-spacing:1px;font-size:13px}.hs5 em{font-style:normal;color:#ead9cc}
.bar2{height:6px;border-radius:99px;background:#f1e5d8;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--pink);border-radius:99px}
.sv-mini svg{width:24px;height:24px;display:block}
.souv{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.souv>svg{width:46px;height:46px;flex:none}
.souv strong{display:block;font-size:14.5px}
.souv span{display:block;font-size:12.8px;color:var(--ink-soft)}
.souv em{display:block;font-style:normal;font-size:11.5px;font-weight:900;color:var(--coral-d);margin-top:2px}
.souv.locked{border-style:dashed;background:transparent}
.souv.locked strong{color:var(--ink-soft)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sgrid .souv{margin:0}
.empty-note{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--ink-soft)}
.foxhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.foxhead>div:last-child{flex:1;min-width:0}
.foxhead .pic{width:108px;flex:none;border-radius:18px;padding:6px;background:var(--mint)}
.foxhead .pic.discret{background:var(--peach)}.foxhead .pic.rare{background:var(--lav)}.foxhead .pic.legend{background:#fbecc0}
.foxhead .pic svg{display:block;width:100%}
.foxhead h2{margin:0 0 4px}
.lvl.big{margin:8px 0 5px;font-size:13px}.lvl.big .hs5{font-size:17px}
.req{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.req span{display:flex;align-items:center;gap:8px;background:var(--card-2);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13.5px}
.req span svg{width:22px;height:22px;flex:none}
.req span.ok{background:var(--mint)}
.btn.wide{width:100%;padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.scene{aspect-ratio:5/4}.bowl{width:17%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pill{font-size:10.5px;padding:3px 9px;top:8px}.bowl small{font-size:9.5px}}

  const now=Date.now();
  return {glands:60,gold:0,owned:{feuilles:1,pomme:1},
    Z:{clairiere:{slots:[null,"pomme",null,null,"feuilles",null,null,null,null],food:{id:"croquettes",until:now+120*60000}}},
    unlocked:["clairiere"],zone:"clairiere",
    visitors:[{fox:"roussette",zone:"clairiere",slot:4,at:now,leaveAt:now+12*60000,pose:"happy"}],
    gifts:[{fox:"biscuit",g:7,o:0}],seen:{roussette:1,biscuit:1},aff:{roussette:2,biscuit:2},last:now,rain:true,best:{hide:0,feed:0}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!(S.slots||S.Z))S=fresh();
if(!S.Z){S.Z={clairiere:{slots:S.slots,food:S.food||null}};S.visitors=(S.visitors||[]).map(v=>({...v,zone:"clairiere"}));delete S.slots;delete S.food}
if(!S.unlocked)S.unlocked=["clairiere"];
if(!S.zone||!S.unlocked.includes(S.zone))S.zone="clairiere";
if(!S.aff){S.aff={};for(const id in S.seen)S.aff[id]=S.seen[id]*2}
if(S.rain===undefined)S.rain=true;
if(!S.best)S.best={hide:0,feed:0};
for(const z in S.Z)while(S.Z[z].slots.length<9)S.Z[z].slots.push(null);
let G=null,loopOn=false,LVUP=[];
const lvlOf=id=>{if(!S.seen[id])return 0;const a=S.aff[id]||0;let l=1;for(let i=1;i<5;i++)if(a>=LV_T[i])l=i+1;return l};
function addAff(id,n){const a=lvlOf(id)||1;S.aff[id]=(S.aff[id]||0)+n;const b=lvlOf(id);if(b>a)LVUP.push([id,b])}
const giftMult=id=>1+.25*(Math.max(1,lvlOf(id))-1);
const affPct=id=>{const L=lvlOf(id);if(L>=5)return 100;const a=S.aff[id]||0;return Math.max(0,Math.min(100,(a-LV_T[L-1])/(LV_T[L]-LV_T[L-1])*100))};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- temps & simulation ---------- */
function phaseOf(t){
  const h=new Date(t).getHours();
  if(h>=6&&h<9)return{id:"aube",label:"Aube · les renards sortent",mult:1.6};
  if(h>=9&&h<18)return{id:"jour",label:"Journée · sieste générale",mult:1};
  if(h>=18&&h<21)return{id:"crepu",label:"Crépuscule · les renards sortent",mult:1.6};
  return{id:"nuit",label:"Nuit · quelques rôdeurs",mult:1.2};
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function pickFox(item,tier,z){
  const here=new Set(S.visitors.map(v=>v.fox)),pool=[];
  for(const f of FOXES){
    if(f.zone!==z||here.has(f.id)||tier<f.food)continue;
    const liked=f.likes.includes(item);
    if(!liked&&!f.any)continue;
    pool.push([f,RAR[f.rar].w*(liked?4:1)]);
  }
  let r=Math.random()*pool.reduce((a,p)=>a+p[1],0);
  for(const [f,w] of pool){if((r-=w)<=0)return f}
  return null;
}
function step(t){
  let n=0;
  S.visitors=S.visitors.filter(v=>{
    if(v.leaveAt<=t){const f=FOX[v.fox];S.gifts.push({fox:f.id,g:Math.round(rnd(...f.gift)*giftMult(f.id)),o:Math.random()<f.goldP?(f.goldN||1):0});return false}
    return true;
  });
  const pm=phaseOf(t).mult;
  for(const z of S.unlocked){
    const Z=S.Z[z];
    if(Z.food&&Z.food.until<=t)Z.food=null;
    if(!Z.food)continue;
    const fd=FOODS[Z.food.id],busy=S.visitors.filter(v=>v.zone===z);
    Z.slots.forEach((it,i)=>{
      if(!it||busy.some(v=>v.slot===i))return;
      if(Math.random()<(busy.length?.2:.4)*pm*fd.mult){
        const f=pickFox(it,fd.tier,z);
        if(f){const r=Math.random(),v={fox:f.id,zone:z,slot:i,at:t,leaveAt:t+rnd(3,12)*60000,pose:f.sleepy?"sleep":r<.45?"sit":r<.75?"sleep":"happy"};
          S.visitors.push(v);busy.push(v);S.seen[f.id]=(S.seen[f.id]||0)+1;addAff(f.id,2);n++}
      }
    });
  }
  return n;
}
function simulate(){
  const now=Date.now();let t=S.last,n=0;
  if(now-t>2*864e5)t=now-2*864e5;
  while(t+TICK<=now){t+=TICK;n+=step(t)}
  S.last=t;return n;
}

const cv=$("rain"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,drops=[],rips=[];
function sizeRain(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
try{new ResizeObserver(sizeRain).observe(cv)}catch(e){addEventListener("resize",sizeRain)}

const mkDrop=init=>({x:Math.random()*(W+80)-40,y:init?Math.random()*H:-20-Math.random()*60,l:9+Math.random()*9,v:3.4+Math.random()*2.4,end:H*(.22+Math.random()*.78),a:.45+Math.random()*.4});
let flakes=[];
function snowDraw(){
  const n=Math.round(W/9);
  while(flakes.length<n)flakes.push({x:Math.random()*W,y:Math.random()*H,r:1.3+Math.random()*2.4,v:.4+Math.random()*.8,p:Math.random()*6.28});
  flakes.length=n;cx.fillStyle="#fff";cx.strokeStyle="rgba(130,160,200,.55)";cx.lineWidth=1;
  for(const f of flakes){f.y+=f.v;f.p+=.02;f.x+=Math.sin(f.p)*.5;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill();cx.stroke()}
}
function rainLoop(){
  cx.clearRect(0,0,W,H);
  const wz=ZONES[S.zone].weather;
  if(S.rain&&!RM&&W&&wz==="snow")snowDraw();
  else if(S.rain&&!RM&&W&&wz==="rain"){
    const n=Math.round(W/6);
    while(drops.length<n)drops.push(mkDrop(true));
    drops.length=n;
    cx.lineCap="round";cx.lineWidth=1.6;
    for(const d of drops){
      d.y+=d.v;d.x-=d.v*.2;
      cx.strokeStyle=`rgba(232,244,255,${d.a})`;
      cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.l*.2,d.y-d.l);cx.stroke();
      if(d.y>=d.end){if(rips.length<40)rips.push({x:d.x,y:d.y,r:1,a:.7,k:.5+d.y/H});Object.assign(d,mkDrop(false))}
    }
    cx.lineWidth=1.2;
    rips=rips.filter(r=>{r.r+=.45;r.a-=.018;if(r.a<=0)return false;cx.strokeStyle=`rgba(255,255,255,${r.a})`;cx.beginPath();cx.ellipse(r.x,r.y,r.r*r.k,r.r*r.k*.4,0,0,Math.PI*2);cx.stroke();return true});
  }
  requestAnimationFrame(rainLoop);
}

/* cache-cache */
function startHide(){
  const seen=FOXES.filter(f=>S.seen[f.id]),unseen=FOXES.filter(f=>!S.seen[f.id]&&f.rar!=="legend"&&S.unlocked.includes(f.zone)),sp=hideSpots();
  const foxes=[];if(unseen.length&&Math.random()<.35)foxes.push(pickOne(unseen));
  const bag=shuffle([...seen]);while(foxes.length<4)foxes.push(bag.pop()||pickOne(seen));
  const spots=shuffle(sp.map((_,i)=>i)).slice(0,4),hidden={};
  shuffle(foxes).forEach((f,k)=>hidden[spots[k]]=f.id);
  G={kind:"hide",sp,phase:"play",t0:performance.now(),dur:35000,penalty:0,hidden,found:{},nextHint:performance.now()+1200,newFox:[],hud:""};
  let h=`<div class="ghud" id="ghud"></div><button class="pill gquit" data-g="quit" type="button">Quitter</button>`;
  sp.forEach((p,i)=>{const f=hidden[i]?FOX[hidden[i]]:null;
    h+=`<button class="hs" data-hs="${i}" type="button" style="left:${p.x}%;top:${p.y}%;width:${(13+p.y*.08).toFixed(1)}%" aria-label="Cachette">${f?`<span class="htail">${tailSVG(f)}</span><span class="hfox">${foxSVG(f,{pose:"happy"})}</span>`:""}<span class="hobj">${HIDE_ART[p.t]}</span></button>`});
  gEl.innerHTML=h;
}
function hideLoop(now){
  const left=Math.max(0,G.dur-(now-G.t0)-G.penalty),total=Object.keys(G.hidden).length,nf=Object.keys(G.found).length;
  const hud=`<span>${Math.ceil(left/1000)} s</span><span>Trouvés ${nf} / ${total}</span>`;
  if(hud!==G.hud){G.hud=hud;$("ghud").innerHTML=hud}
  if(now>=G.nextHint){
    G.nextHint=now+1200+Math.random()*900;
    const rem=Object.keys(G.hidden).filter(i=>!G.found[i]);
    if(rem.length){
      const real=Math.random()<.62,i=real?pickOne(rem):Math.floor(Math.random()*G.sp.length);
      const b=gEl.querySelector(`[data-hs="${i}"]`);
      if(b&&!G.found[i]){if(real&&Math.random()<.45)restartAnim(b.querySelector(".htail"),"peek");else restartAnim(b.querySelector(".hobj"),"rustle")}
    }
  }
  if(left<=0||nf===total)endHide(left,nf,total);
}
function hideTap(b){
  const i=b.dataset.hs;if(G.found[i])return;
  if(G.hidden[i]){G.found[i]=1;b.classList.add("found");burst(b);floatText(b,"Trouvé !");discover(FOX[G.hidden[i]])}
  else{G.penalty+=2000;restartAnim(b,"nope");floatText(b,"-2 s")}
}
function endHide(left,nf,total){
  G.phase="end";
  Object.keys(G.hidden).forEach(i=>{if(!G.found[i])gEl.querySelector(`[data-hs="${i}"]`)?.classList.add("found","missed")});
  const all=nf===total,bonus=all?Math.ceil(left/1000):0,g=nf*6+bonus,rec=g>(S.best.hide||0);
  if(rec)S.best.hide=g;S.glands+=g;save();setTimeout(flushLv,1600);renderShop();renderAlbum();renderScene();renderPlay();
  const me=G;

}

function spawnSeat(now){
  const free=G.seats.map((s,i)=>s?-1:i).filter(i=>i>=0);if(!free.length)return;
  const i=pickOne(free),present=new Set(G.seats.filter(Boolean).map(s=>s.fox.id));
  const seen=FOXES.filter(f=>S.seen[f.id]&&!present.has(f.id)),unseen=FOXES.filter(f=>!S.seen[f.id]&&f.rar!=="legend"&&S.unlocked.includes(f.zone)&&!present.has(f.id));
  const f=(unseen.length&&Math.random()<.07)?pickOne(unseen):seen.length?pickOne(seen):FOXES.find(x=>S.seen[x.id]);
  const want=FEED_FOODS[Math.floor(Math.random()*(G.score<80?2:G.score<220?3:4))][0];
  const el=document.createElement("div");el.className="seat";el.style.left=SEATS[i].x+"%";el.style.top=SEATS[i].y+"%";
  el.innerHTML=bubbleHTML(want)+foxSVG(f,{pose:"sit"});

}
function feedLoop(now){
  const left=Math.max(0,G.dur-(now-G.t0)),mult=Math.min(5,1+Math.floor(G.combo/3));
  const hud=`<span>${Math.ceil(left/1000)} s</span><span>${G.score} pts${mult>1?` · x${mult}`:""}</span><span style="color:#f47f9a">${"♥".repeat(G.lives)}${"♡".repeat(3-G.lives)}</span>`;
  if(hud!==G.hud){G.hud=hud;$("ghud").innerHTML=hud}
  if(now>=G.nextSpawn){spawnSeat(now);G.nextSpawn=now+Math.max(450,1500-G.score*2.5)+Math.random()*700}
  G.seats.forEach((s,i)=>{if(!s)return;
    if(s.state==="wait"){
      const r=1-(now-s.start)/s.patience,ring=s.el.querySelector(".ring");
      ring.setAttribute("stroke-dashoffset",(138.2*(1-Math.max(0,r))).toFixed(1));ring.setAttribute("stroke",r<.3?"#f47f7f":r<.6?"#f2c75c":"#a9d68f");
      if(r<=0){s.state="sad";s.until=now+700;G.lives--;G.combo=0;s.el.querySelector(".bub-ic").innerHTML=foodIcon("ennui");s.el.classList.add("sad")}
    }else if(now>=s.until){s.el.remove();G.seats[i]=null}
  });
  if(left<=0||G.lives<=0)endFeed();

function feed(id,btn){
  if(!G||G.kind!=="feed"||G.phase!=="play")return;
  const now=performance.now();let best=-1,bt=Infinity;
  G.seats.forEach((s,i)=>{if(s&&s.state==="wait"&&s.want===id){const rem=s.patience-(now-s.start);if(rem<bt){bt=rem;best=i}}});
  if(best<0){G.combo=0;restartAnim(btn,"nope");if(btn)floatText(btn,"Oups");return}
  const s=G.seats[best],mult=Math.min(5,1+Math.floor(G.combo/3)),pts=10*mult+Math.round(Math.max(0,bt)/s.patience*5);
  G.score+=pts;G.combo++;G.served++;s.state="happy";s.until=now+750;
  s.el.innerHTML=bubbleHTML("coeur",false)+foxSVG(s.fox,{pose:"happy"});s.el.classList.add("happy");
  burst(s.el);floatText(s.el,`+${pts}`);discover(s.fox);
}

    else if(n){
      const newSeen=FOXES.filter(f=>S.seen[f.id]).length;
      if(first)toast(`Pendant ton absence : ${n} visite${n>1?"s":""} !`);
      else if(newSeen>seenBefore)toast("Un nouveau renard ! Regarde ton carnet.");
      else{const v=S.visitors[S.visitors.length-1];if(v)toast(`${FOX[v.fox].name} vient d'arriver${v.zone===S.zone?"":` (${ZONES[v.zone].name})`} ♥`)}
    }
  }
  renderScene();
}
renderShop();renderAlbum();renderSouv();tick(true);
setInterval(()=>tick(false),5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick(true)});
</script>
