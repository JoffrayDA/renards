<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éclair</title>
<style>
body{margin:0;padding:16px;background:#f6ece4;color:#5b4250;font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:12px}
.c{background:#fffaf5;border:2px solid #ead9cf;border-radius:14px;padding:10px;text-align:center;width:150px}
.c b{display:block;margin-top:4px}.c span{font-size:12px;opacity:.7}
.big{width:120px;height:120px}.mid{width:48px;height:48px}.sm{width:30px;height:30px}
.sizes{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin-top:6px}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></svg>
<h1>L'éclair de Paris</h1>
<p>Dans le même style que le pain au chocolat (version A), en grand puis à la taille de la tuile et de la bulle du client. La B est dans le jeu (choix de Joffray). En bas, le pain au chocolat pour comparer.</p>
<div class="row" id="out"></div>
<script src="../js/cafe/foxes.js"></script>
<script src="../js/foxart.js"></script>
<script>
const K=`stroke="${INK}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`,K2=`stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;
const KB=`stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const ICON_PC=`<path d="M4 28 V20 Q4 13 11 12 Q20 10.4 28 12 Q32 12.8 32.4 17 L32.4 29 Q32 32 28.5 32 H8 Q4 32 4 28Z" fill="#d98a3a" ${KB}/>
     <path d="M6.6 17.6 Q7.4 14.4 11.4 14 Q20 12.6 27.6 14 Q30.4 14.6 30.6 17.4 Q19 15.8 6.6 17.6Z" fill="#f2b862"/>
     <path d="M10 14.6 Q14 13.6 17 13.6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/>
     <path d="M5 21.6 Q18 20 31.6 21.6 M5 25.2 Q18 23.6 31.6 25.2 M5 28.8 Q18 27.2 31.6 28.8" stroke="#a65a1e" stroke-width="1.4" fill="none"/>
     <path d="M5 23.4 Q18 21.8 31.6 23.4 M5 27 Q18 25.4 31.6 27" stroke="#eba85a" stroke-width="1.2" fill="none"/>
     <ellipse cx="33.2" cy="22" rx="4.6" ry="9.6" fill="#f3cf8e" ${KB}/>
     <path d="M33.2 13.6 Q36.6 14.4 36.6 22 Q36.6 29 33.4 30 Q30.4 29 30.4 22 Q30.4 17 33.2 16.8 Q35 17.2 35 22 Q35 26.6 33.2 27.2" stroke="#c98a45" stroke-width="1.1" fill="none" stroke-linecap="round"/>
     <ellipse cx="33.2" cy="19.6" rx="2.2" ry="1.7" fill="#4a2a1c"/><ellipse cx="33.2" cy="24.6" rx="2.2" ry="1.7" fill="#4a2a1c"/>`;
const V={
  // A : trois quarts, choux doré, glaçage chocolat brillant qui coule, bout coupé : la crème pâtissière
  A:`<path d="M4 25 Q2.6 25 2.6 21.6 Q2.6 16.6 8 16 H31 Q34.6 16.4 34.6 20 V27.4 Q34.6 29.6 31.6 29.6 Q19 31 7.4 29.4 Q4 28.8 4 25Z" fill="#d98a3a" ${KB}/>
     <path d="M5 26.4 Q19 28.4 33.4 26.6" stroke="#a65a1e" stroke-width="1.3" fill="none"/>
     <path d="M8 27.8 l1 -1.6 M14 28.6 l1 -1.6 M20 28.8 l1 -1.6 M26 28.6 l1 -1.6" stroke="#eba85a" stroke-width="1.2" stroke-linecap="round"/>
     <path d="M4.4 20.6 Q4.4 16.6 9 16.2 H30.6 Q33.6 16.6 33.8 20 Q32 22.2 30.2 21 Q28.8 24 26.4 21.8 Q24 23.4 21.6 21.8 Q19.4 24.4 17 22 Q14.4 23.6 12.2 21.8 Q10 23.2 8.4 21.4 Q6.2 22.6 4.4 20.6Z" fill="#5a3324" ${KB}/>
     <path d="M8.6 18.4 Q14 17 20 17.4" stroke="#a9765c" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="23.4" cy="17.8" r="1" fill="#fff" opacity=".8"/>
     <ellipse cx="34.6" cy="23" rx="3.8" ry="6.8" fill="#e9a453" ${KB}/>
     <ellipse cx="34.6" cy="23.6" rx="2.2" ry="4.6" fill="#fff1c8"/><path d="M33.4 21 q1.2 -.6 2.2 .2" stroke="#f2d98a" stroke-width="1.1" fill="none" stroke-linecap="round"/>`,
  // B : de profil, entier, bouts arrondis, glaçage qui coule sur les côtés
  B:`<path d="M9 15.6 H31 Q37.4 15.6 37.4 22.4 Q37.4 29.4 31 29.4 H9 Q2.6 29.4 2.6 22.4 Q2.6 15.6 9 15.6Z" fill="#d98a3a" ${KB}/>
     <path d="M5 26.4 Q20 28.6 35 26.4" stroke="#a65a1e" stroke-width="1.3" fill="none"/>
     <path d="M9 27.8 l1 -1.6 M15 28.4 l1 -1.6 M21 28.6 l1 -1.6 M27 28.4 l1 -1.6" stroke="#eba85a" stroke-width="1.2" stroke-linecap="round"/>
     <path d="M3.4 20.4 Q4 15.6 9 15.6 H31 Q36.2 15.6 36.6 20.4 Q35 23 33 21.4 Q31.4 24.8 29 22 Q26.6 23.8 24.2 22 Q22 25 19.6 22.2 Q17 23.8 14.8 22 Q12.4 24.6 10.4 21.8 Q8 23.4 6.2 21.4 Q4.6 22.4 3.4 20.4Z" fill="#5a3324" ${KB}/>
     <path d="M8 18 Q14 16.8 21 17.2" stroke="#a9765c" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="24.4" cy="17.6" r="1" fill="#fff" opacity=".8"/>`,
  P:ICON_PC
};
const NAMES={A:["A · Trois quarts","bout coupé : on voit la crème"],B:["B · De profil","entier, glaçage qui coule"],P:["Pain au chocolat","pour comparer"]};
const sv=(k,c)=>`<svg class="${c}" viewBox="0 0 40 40"><g filter="url(#wobble)">${V[k]}</g></svg>`;
document.getElementById("out").innerHTML=Object.keys(V).map(k=>`<div class="c">${sv(k,"big")}<b>${NAMES[k][0]}</b><span>${NAMES[k][1]}</span><div class="sizes">${sv(k,"mid")}${sv(k,"sm")}</div></div>`).join("");
</script></body></html>
