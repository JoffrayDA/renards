<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6ece4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
.home{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fffaf2;border:2px solid #ead9cc;color:#5b4250;text-decoration:none;font:900 20px/1 system-ui;box-shadow:0 3px 0 #ead9cc;flex:none}</style>
<title>Kitsune Café</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout : en-tête compact, la salle (une véranda) en haut, le plateau, puis la cuisine en deux rangées : boissons, puis four et pâtisseries */
:root{
  --bg:#f6ece4; --dot:#efdcd0; --card:#fffaf2; --card-2:#fbefe0;
  --ink:#5b4250; --ink-soft:#8f7a86; --line:#ead9cc;
  --coral:#f59a8b; --coral-d:#dc7d6e; --mint:#d6ead0; --gold:#f2c75c; --gold-d:#d6a93a; --pink:#f6a5b4; --good:#8fca7a; --warn:#f2c75c; --bad:#f47f7f;
  --display:"Mochiy Pop One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Zen Maru Gothic","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:26px 26px;-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px 20px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px}
.back{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);flex:none;cursor:pointer;padding:0}
.back svg{width:16px;height:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,5vw,26px);margin:0;line-height:1.1}
h1 span{color:var(--coral-d)}
.coin{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 5px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line)}
.coin svg{width:24px;height:24px}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

.hud{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.day{font-family:var(--display);font-weight:400;background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.combo{background:var(--gold);border-color:var(--gold-d);animation:pop .3s}
.goal{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.gbar{position:relative;flex:1;height:14px;border-radius:99px;background:#f1e2d6;border:2px solid var(--line);overflow:visible}
.gbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),#f7a96a);transition:width .25s}
.tick{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#d9c7b8;line-height:1;text-shadow:0 0 2px #fff}
.tick.on{color:var(--gold-d)}
.goal b{font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.scene>.chips{inset:auto;left:8px;bottom:8px;z-index:5;display:flex;gap:6px;pointer-events:none}
.chips .pill{font-size:12px;padding:1px 10px;box-shadow:0 2px 0 rgba(91,66,80,.15)}

.scene{position:relative;width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 12px 26px rgba(91,66,80,.16);background:#fbe6d6;user-select:none;-webkit-user-select:none}
.scene>div{position:absolute;inset:0}
.scene svg.full{position:absolute;inset:0;width:100%;height:100%}
#counter,#bgl{pointer-events:none}
.notes{position:absolute;left:86%;top:11%;font-family:var(--display);color:var(--ink);font-size:clamp(10px,2vw,16px);animation:note 2.4s ease-in-out infinite;pointer-events:none}
@keyframes note{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-14px) rotate(12deg)}}

#custs{z-index:1}
#counter{z-index:2}
#helper{z-index:3;pointer-events:none}
#closed{z-index:4;display:grid;place-items:center;background:rgba(91,66,80,.16)}
.closed-in{display:flex;flex-direction:column;align-items:center;gap:8px}
.sign{font-family:var(--display);background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:4px 18px;font-size:clamp(16px,4vw,24px);transform:rotate(-4deg);box-shadow:0 4px 0 var(--ink)}
.cust{position:absolute;bottom:31%;width:17%;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;animation:enter .5s cubic-bezier(.3,1.5,.5,1)}
.cust>svg{display:block;width:100%}
.cust.happy{animation:leaveH .9s ease-in forwards}
.cust.angry{animation:leaveA .9s ease-in forwards}
.cust.low>svg{animation:fidget .5s infinite}
@keyframes enter{from{opacity:0;transform:translate(-50%,30%)}to{opacity:1;transform:translateX(-50%)}}
@keyframes leaveH{0%{transform:translateX(-50%)}25%{transform:translate(-50%,-8%)}50%{transform:translateX(-50%);opacity:1}100%{transform:translate(-50%,30%);opacity:0}}
@keyframes leaveA{to{transform:translate(-50%,30%);opacity:0}}
@keyframes fidget{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.bub{position:absolute;left:50%;bottom:80%;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 5px 5px;display:flex;flex-direction:column;gap:3px;align-items:stretch;box-shadow:0 3px 0 rgba(91,66,80,.18)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub.vipb{border-color:var(--gold-d);background:#fff8e2}.bub.vipb::after{background:#fff8e2;border-color:var(--gold-d)}
.vip{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-family:var(--display);font-size:9px;font-style:normal;border-radius:99px;padding:0 6px;border:2px solid var(--gold-d);white-space:nowrap}
.oi-row{display:flex;gap:2px;justify-content:center}
.oi{width:clamp(18px,4.3vw,30px);position:relative;display:block}
.oi svg{display:block;width:100%}
.oi.done{opacity:.28}
.pb{height:5px;border-radius:9px;background:#f1e5d8;overflow:hidden;position:relative;z-index:1}
.pb i{display:block;height:100%;background:var(--good);border-radius:9px}
.heart{position:absolute;font-size:20px;color:#f47f9a;pointer-events:none;animation:heart 1.2s ease-out forwards;z-index:8}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-60px)}}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(13px,2.6vw,18px);color:var(--ink);text-shadow:0 2px 0 #fff,0 -1px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:floatup 1.1s ease-out forwards;pointer-events:none;z-index:9;white-space:nowrap}
.float.gold{color:#b07a12}
@keyframes floatup{to{transform:translate(-50%,-190%);opacity:0}}

.tray{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 10px;box-shadow:0 3px 0 var(--line)}
.tl{font-family:var(--display);font-size:13px;color:var(--ink-soft);margin-right:2px}
.ts{width:46px;aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);background:var(--card-2);display:grid;place-items:center;padding:4px;flex:0 1 auto;min-width:34px;box-sizing:border-box}
button.ts{position:relative;border-style:solid;border-color:var(--ink);background:#fff;cursor:pointer}
button.ts.new{animation:pop .25s}
button.ts.arm{border-color:var(--bad);background:#ffe9e6;animation:fidget .4s infinite}
.ts .bin{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:99px;background:#fff;border:2px solid var(--bad);display:grid;place-items:center;padding:2px}
.ts svg{width:100%;height:100%}
.tray small{margin-left:auto;font-size:12px;color:var(--ink-soft);text-align:right;line-height:1.3}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.kit{display:flex;flex-direction:column;gap:9px}
.krow{display:flex;gap:8px;justify-content:center}
.kw{position:relative;flex:1 1 0;min-width:0;max-width:190px;display:flex}
.kb{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.kb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kb:disabled{cursor:default}
.ki{position:relative;width:40px;height:40px;display:block;flex:none}
.ki svg{width:100%;height:100%;display:block}
.kn{font-size:11.5px;font-weight:900;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center;overflow:hidden;overflow-wrap:anywhere}
.slots,.kb .obar{margin-top:auto;width:100%}
.slots{display:flex;gap:4px;justify-content:center}
.sl{flex:1;max-width:40px;height:7px;border-radius:99px;background:#f1e5d8;overflow:hidden}
.sl i{display:block;height:100%;width:0;background:var(--coral)}
.sl.ready{background:var(--good);animation:blink .7s infinite alternate}
.sl.ready i{background:transparent}
.kb.rdy{border-color:var(--good);box-shadow:0 4px 0 #b6dca8;background:#f3fbef}
.kb.rdy .ki{animation:bounce .6s infinite alternate}
.kb.empty .ki{opacity:.45}
@keyframes bounce{to{transform:translateY(-4px)}}
@keyframes blink{to{opacity:.55}}
.badge{position:absolute;top:-7px;right:-4px;min-width:26px;height:26px;border-radius:99px;background:var(--ink);color:#fff;font-weight:900;font-size:13px;line-height:1;display:grid;place-items:center;padding:0 6px;border:2px solid #fff;pointer-events:none;font-variant-numeric:tabular-nums;box-sizing:border-box}
.badge.zero{background:#cdbfc7}
.kbake{position:absolute;top:-8px;left:-5px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:2px;cursor:pointer;display:grid;place-items:center}
.kbake svg{width:100%;height:100%}
.kbake:active{transform:translateY(2px);box-shadow:none}
.mini{position:absolute;right:-8px;bottom:-5px;width:24px;height:24px;background:#fff;border-radius:50%;border:2px solid var(--ink);padding:1px;box-sizing:border-box}
.mini svg{width:100%;height:100%}
.kb.oven.bake{background:#fff3e6}
.kb.oven.ready{background:var(--good);border-color:#6fae5e;box-shadow:0 4px 0 #6fae5e;color:#fff;animation:blink .5s infinite alternate}
.kb.oven.ready.danger{background:var(--bad);border-color:#d85f5f;box-shadow:0 4px 0 #d85f5f}
.kb.oven.burnt .kn{color:var(--bad)}
.obar{height:7px;border-radius:99px;background:#f1e5d8;overflow:hidden}
.obar i{display:block;height:100%;width:0;background:var(--coral)}
.kb.shake,.cust.shake>svg,.ts.shake{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-5px 0}75%{translate:5px 0}}
.hint{margin:0;font-size:13.5px;color:var(--ink-soft);min-height:1.5em}
.hint b{color:var(--ink)}

.btn{font-weight:900;border:0;border-radius:999px;cursor:pointer;padding:8px 18px;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);font-size:14.5px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn:disabled{background:#eadfd6;color:#b3a3a8;box-shadow:0 3px 0 #ddd0c6;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.big{font-family:var(--display);font-weight:400;font-size:17px;padding:11px 24px}
.btn.wide{width:100%}
.sheet{position:fixed;inset:0;background:rgba(91,66,80,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-in{background:var(--card);width:100%;max-width:600px;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:86vh;overflow:auto;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:400;margin:0 0 4px;font-size:21px}
.sub{margin:0 0 12px;color:var(--ink-soft);font-size:13.8px}
.goals{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.goals span{flex:1;min-width:90px;background:var(--card-2);border-radius:14px;padding:8px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.goals span em{display:block;font-style:normal;color:var(--gold-d);letter-spacing:2px}
.col{display:flex;flex-direction:column;gap:8px}
.tuto{background:var(--mint);border-radius:16px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
.tuto ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold);text-align:center;line-height:1.1;margin:4px 0 6px}
.stars em{font-style:normal;color:#e9dccf}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.stats div{background:var(--card-2);border-radius:12px;padding:6px 10px;font-size:13px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tab{font-family:var(--display);font-size:13.5px;background:var(--card-2);border:2px solid var(--line);color:var(--ink-soft);padding:5px 14px;border-radius:999px;cursor:pointer}
.it .lvd{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.lvd i{display:block;width:8px;height:8px;border-radius:99px;border:1.6px solid var(--ink);background:#fff}.lvd i.on{background:var(--gold)}
.tab.on{background:var(--coral);border-color:var(--coral);color:#fff}
.shop{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card-2);border-radius:18px;padding:10px 12px}
.it .ic{width:48px;height:48px;flex:none;background:#fff;border-radius:14px;padding:5px;border:2px solid var(--line)}
.it .ic svg{width:100%;height:100%}
.it .tx{flex:1;min-width:0}
.it strong{display:block;font-size:15px}
.it span{display:block;font-size:12.6px;color:var(--ink-soft)}
.it .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.price{display:flex;align-items:center;gap:3px;font-weight:900;font-variant-numeric:tabular-nums}
.price svg{width:18px;height:18px}
.owned{font-weight:900;color:#5f9a4e;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fc{background:var(--card-2);border-radius:16px;padding:6px 6px 8px;text-align:center;font-size:12px;font-weight:700}
.fc svg{display:block;width:100%}
.fc em{display:block;font-style:normal;font-weight:500;color:var(--ink-soft);font-size:11px}
.fc.vipc{background:#fbf0cc}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13.5px;max-width:min(92vw,440px);text-align:center;z-index:30;box-shadow:0 8px 24px rgba(91,66,80,.25);animation:up .3s ease-out}

/* Carte : plein écran par-dessus le café, on monte du jour 1 (en bas) au jour 40 */
.map{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg)}
.mtop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:3px solid var(--line);z-index:2}
.mtt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.mtt b{font-family:var(--display);font-weight:400;font-size:18px}
.mtt span{font-size:12.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.mst{background:#fff4cf;border-color:var(--gold);color:#9a6c0c}
.mscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:26px 26px}
.mwrap{position:relative;width:min(100%,520px);margin:0 auto;box-shadow:0 0 0 3px #fff,0 0 30px rgba(91,66,80,.12)}
.mwrap>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mbar{display:flex;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--card);border-top:3px solid var(--line);justify-content:center}
.mbar .btn{flex:1;max-width:170px;font-family:var(--display);font-weight:400;padding:10px 8px}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:3.5px solid var(--ink);background:#fff6ec;box-shadow:0 5px 0 var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;z-index:1}
.node b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1}
.node:active{transform:translate(-50%,calc(-50% + 3px));box-shadow:0 2px 0 var(--ink)}
.node.done{background:#ffe3e6}
.node.gold{background:linear-gradient(#fbe08e,#f2c75c)}
.node.cur{background:var(--coral);color:#fff;animation:nodep 1.3s ease-in-out infinite}
.node.cur b{text-shadow:0 2px 0 var(--coral-d)}
.node.lock{background:#e9e0da;color:#b3a3a8;border-color:#b9aab0;box-shadow:0 5px 0 #b9aab0}
@keyframes nodep{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(245,154,139,.6)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(245,154,139,0)}}
.nst{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);display:flex;gap:0;font-size:17px;line-height:1;font-style:normal;white-space:nowrap}
.nst i{font-style:normal;color:#fff;-webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill}
.nst i:nth-child(2){transform:translateY(4px)}
.nst i.on{color:var(--gold)}
.node.lock .nst{display:none}
.nb{position:absolute;right:-12px;top:-10px;width:28px;height:28px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);padding:2px;display:block}
.nb svg{display:block;width:100%;height:100%}
.gbtn{position:absolute;transform:translate(-50%,-50%);width:100px;height:80px;background:none;border:0;cursor:pointer;border-radius:20px}
.gbtn.want{animation:gwant 1.3s ease-in-out infinite}
@keyframes gwant{50%{background:rgba(242,199,92,.35)}}
.mguest{position:absolute;transform:translate(-50%,-80%);width:78px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mguest svg{width:78px;display:block;filter:drop-shadow(0 4px 0 rgba(91,66,80,.15))}
.mguest em{font-style:normal;font-size:11.5px;font-weight:900;background:#fffaf2;border:2px solid var(--ink);border-radius:99px;padding:0 8px;margin-top:-6px;white-space:nowrap}
.mguest.ok em{background:var(--gold)}
.mfox{position:absolute;transform:translate(-50%,-128%);width:58px;pointer-events:none;z-index:2;animation:hop 1s ease-in-out infinite alternate}

    if(lv("serveur")>1&&G.oven.state==="idle"){const r=w.flatMap(c=>c.order.filter(x=>!x.done&&REC[x.r].kind==="bake"&&!G.vit[x.r]).map(x=>x.r))[0];if(r)bake(r)}}}

const custEl=c=>document.querySelector(`[data-cust="${c.id}"]`);
function deliver(c,el){
  if(c.state!=="wait")return;let got=0;
  c.order.forEach(o=>{if(o.done)return;const k=G.tray.indexOf(o.r);if(k>=0){G.tray.splice(k,1);o.done=1;got++;G.arm=null}});
  if(!got){shake(el);hint(`${FOX[c.fox].name} veut : <b>${c.order.filter(o=>!o.done).map(o=>REC[o.r].name.toLowerCase()).join(", ")}</b>. Prépare-le et pose-le sur le plateau.`);return}

function complete(c){
  const frac=Math.max(0,c.pat/c.patMax),base=c.order.reduce((a,o)=>a+REC[o.r].price,0);
  let tip=Math.round(base*.45*frac*tipMult()*(G.boost.tips?2:1));
  if(frac>=.5){G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);qEvent("combo",G.combo);if(G.combo===3)qEvent("combo3")}else G.combo=0;
  const cb=G.combo>=3?Math.min(G.combo,6)-1:0;
  let tot=base+tip+cb;if(c.vip){tot*=3;G.vipServed++;qEvent("vip")}
  // la recette (objectif, étoiles) compte le prix payé ; on ne garde en pièces que le bénéfice, et 30 % quand on rejoue
  const cost=c.order.reduce((a,o)=>a+REC[o.r].cost,0),gain=Math.max(0,Math.round((tot-cost)*(G.replay?.3:1)));
  G.earned+=tot;G.cost+=cost;G.gain+=gain;S.coins+=gain;S.total+=gain;G.served++;S.served++;
  c.order.forEach(o=>qEvent("serve",1,o.r));qEvent("orders");if(c.order.length>=3)qEvent("big");
  if(frac>=.6)qEvent("green");
  c.state="happy";c.leave=.9;
  // Halloween : les clients déguisés donnent des bonbons (2 s'ils sont servis vite), les invités d'Halloween 5
  const cdy=HW?(FOX[c.fox].event?5:c.costume?(frac>=.5?2:1):0):0;
  if(cdy){S.candy+=cdy;G.candy+=cdy;qEvent("candy",cdy)}
  if(c.costume)qEvent("costume");
  // album d'Halloween : servir chacun des invités une fois donne la Couronne de citrouilles à Roussette
  if(FOX[c.fox].event){qEvent("hwguest");if(!S.hwServed[c.fox]){S.hwServed[c.fox]=1;const k=HWF.filter(f=>S.hwServed[f.id]).length;toast(`Album d'Halloween : ${FOX[c.fox].name} ! (${k} / ${HWF.length})`);if(k===HWF.length&&!S.own["st-acc-couronne"]){S.own["st-acc-couronne"]=1;G.albumNew=1}}}
  const el=custEl(c);if(el){burst(el);floatAt(el,`+${tot}`,true);if(cb){const n=G.combo;setTimeout(()=>floatAt(el,`Combo ×${n}`),250)}if(cdy)setTimeout(()=>floatAt(el,`+${cdy} bonbon${cdy>1?"s":""}`),cb?500:250)}
  dirty=true;
}
function tapStation(k,el){

  if(r){if(G.tray.length>=trayCap()){shake($("tray"));toast("Plateau plein ! Sers un client ou jette un article.");return}r.ready=0;r.t=0;G.tray.push(k);G.popI=G.tray.length-1;G.arm=null;dirty=true;return}

}
function bake(k){const o=G.oven;if(o.state!=="idle")return;Object.assign(o,{state:"bake",r:k,t:0,dur:REC[k].time*[1,.7,.55][lv("fourpro")]*(G.boost.four?.5:1)});dirty=true}
function unload(){const o=G.oven;if(o.state!=="ready")return;G.vit[o.r]=Math.min(S.own.four2?14:9,(G.vit[o.r]||0)+batchOf(o.r));o.state="idle";dirty=true}
function fromVit(k,el){if(!G.vit[k])return;if(G.tray.length>=trayCap()){shake($("tray"));toast("Plateau plein !");return}G.vit[k]--;G.tray.push(k);G.popI=G.tray.length-1;G.arm=null;dirty=true}

  S.streak=S.lastDay===ys?S.streak+1:1;S.lastDay=td;const b=10+Math.min(S.streak,7)*5;S.coins+=b;save();renderHud();

// Coordonnées en unités de carte : 400 de large, u compté depuis le bas (le jour 1 est en bas, on monte comme sur un chemin).
const MW=400;
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const stem=(x,y,h,k)=>`<path d="M${x} ${y} V${y-h*k}" stroke="#6fae5e" stroke-width="${2.6*k}" stroke-linecap="round"/>`;
const daisy=(x,y,k,pet,mid)=>Array.from({length:6},(_,i)=>{const a=i/6*Math.PI*2;return `<circle cx="${x+Math.cos(a)*4.4*k}" cy="${y+Math.sin(a)*4.4*k}" r="${3.4*k}" fill="${pet}" stroke="${INK}" stroke-width="1.5"/>`}).join("")+`<circle cx="${x}" cy="${y}" r="${3*k}" fill="${mid}" stroke="${INK}" stroke-width="1.5"/>`;

const birch=(x,y,k,crown,dots)=>shadow(x,y,18*k)+`<rect x="${x-4*k}" y="${y-34*k}" width="${8*k}" height="${36*k}" rx="${3*k}" fill="#fffaf2" ${BO}/><path d="M${x-4*k} ${y-12*k} h${4*k} M${x} ${y-22*k} h${4*k} M${x-4*k} ${y-28*k} h${3*k}" stroke="${INK}" stroke-width="2.2"/>`+blob([[x-9*k,y-40*k,11*k],[x+9*k,y-42*k,10*k],[x,y-52*k,12*k]],crown)+`<circle cx="${x-5*k}" cy="${y-56*k}" r="${3.6*k}" fill="#fff" opacity=".45"/>`+(dots?[[-10,-40],[6,-50],[11,-38]].map(([a,b])=>`<circle cx="${x+a*k}" cy="${y+b*k}" r="${2.4*k}" fill="${dots}"/>`).join(""):"");

  s+=`<path d="M${x-38} ${y-56} Q${x} ${y-86} ${x+38} ${y-56}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="M${x-38} ${y-56} Q${x} ${y-86} ${x+38} ${y-56}" fill="none" stroke="${wood}" stroke-width="7" stroke-linecap="round"/>`;
  if(open)s+=[-30,-18,-6,6,18,30].map((a,i)=>`<circle cx="${x+a}" cy="${y-62-(1-(a/38)**2)*12}" r="4.6" fill="${["#f6a5b4","#f7d77a","#c9b8f2"][i%3]}" stroke="${INK}" stroke-width="1.8"/>`).join("");
  s+=`<rect x="${x-44}" y="${y-104}" width="88" height="26" rx="10" fill="#fffaf2" ${BO}/><text x="${x}" y="${y-86}" text-anchor="middle" font-family="Mochiy Pop One,sans-serif" font-size="13" fill="${INK}">${open?c.name:`★ ${c.gate}`}</text>`;
  return s;
}
function mapSVG(L){
  const {P,gates,way,bands,guests,H}=L,Y=u=>H-u,R=rng(42);
  let defs="",s="";
  // saisons : on dessine du haut vers le bas pour que chaque bord ondulé recouvre la saison du dessus
  for(const b of [...bands].reverse()){
    const id=b.c.id,ld=LAND[id],top=Y(b.hi),bot=Y(b.lo);
    defs+=`<pattern id="pt-${id}" width="120" height="104" patternUnits="userSpaceOnUse"><path d="M10 16 l3 -6 l3 6 M78 70 l3 -6 l3 6 l3 -6 l3 6" fill="none" stroke="${ld.mk}" stroke-width="2.4" stroke-linecap="round"/>${[[54,22],[24,82]].map(([x,y])=>[0,1,2,3].map(i=>`<circle cx="${x+[-3,3,0,0][i]}" cy="${y+[0,0,-3,3][i]}" r="2.2" fill="${ld.mk}"/>`).join("")).join("")}<circle cx="100" cy="30" r="2.4" fill="${ld.mk}"/><circle cx="58" cy="94" r="1.8" fill="${ld.mk}"/><path d="M36 52 q6 -8 12 0 q-6 4 -12 0Z M104 92 q5 -7 10 0 q-5 3 -10 0Z" fill="${ld.mk}"/></pattern>`;
    let edge=`M0 ${bot} L0 ${top}`;
    if(b.hi<H){for(let x=0;x<MW;x+=50)edge+=` Q${x+25} ${top-14} ${x+50} ${top}`}else edge+=` L${MW} ${top}`;
    edge+=` L${MW} ${bot}Z`;
    s+=`<path d="${edge}" fill="${ld.bg}"/><path d="${edge}" fill="url(#pt-${id})"/>`;
    if(b.hi<H){let w=`M0 ${top}`;for(let x=0;x<MW;x+=50)w+=` Q${x+25} ${top-14} ${x+50} ${top}`;s+=`<path d="${w}" fill="none" stroke="${INK}" stroke-width="3" opacity=".35"/>`}
  }
  // le chemin, puis la partie déjà parcourue en pointillés roses
  const pts=way.map(p=>[p.x,Y(p.u)]),d=smooth(pts);
  s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fdf1df" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>`;
  const cur=curDay(),k=way.findIndex(p=>p.d===cur),done=smooth(pts.slice(0,k+1));
  s+=`<path d="${d}" fill="none" stroke="#ead2bb" stroke-width="4" stroke-dasharray="1 15" stroke-linecap="round"/>`;
  if(k>0)s+=`<path d="${done}" fill="none" stroke="#f59a8b" stroke-width="7" stroke-dasharray="1 15" stroke-linecap="round"/>`;
  // déco : posée au hasard (graine fixe) loin du chemin, des portes et des invités
  const taken=[...gates.map(g=>[g.x,g.u+50,82]),...guests.map(g=>[g.x,g.u,60]),[200,70,80],...(HW?[[322,104,62]]:[])],deco=[];
  for(const b of bands){
    const n=Math.floor((b.hi-b.lo)/44),fs=HW?[...DECO[b.c.id],jack,ghostie,jack]:DECO[b.c.id],last=[];
    for(let j=0;j<n;j++)for(let t=0;t<14;t++){
      const u=b.lo+34+R()*(b.hi-b.lo-60),x=24+R()*(MW-48);
      if(Math.abs(x-pathX(way,u))<76||taken.some(([a,c,r])=>Math.hypot(a-x,c-u)<r)||deco.some(o=>Math.hypot(o.x-x,o.u-u)<54))continue;
      let f;do f=Math.floor(R()*fs.length);while(last.includes(f));last.push(f);if(last.length>3)last.shift();
      deco.push({x,u,f:fs[f],k:.75+R()*.4});break;
    }
  }
  deco.sort((a,b)=>b.u-a.u).forEach(o=>s+=o.f(o.x.toFixed(1)*1,Y(o.u).toFixed(1)*1,o.k));
  // le café de départ, les portes, le panneau de fin
  const cy=Y(70);
  s+=shadow(200,cy+16,56)+`<rect x="160" y="${cy-28}" width="80" height="44" rx="6" fill="#fff5e8" ${BO}/><path d="M150 ${cy-26} L200 ${cy-62} L250 ${cy-26}Z" fill="#f59a8b" ${BO}/><rect x="190" y="${cy-8}" width="20" height="24" rx="4" fill="#c8946a" ${BO}/><rect x="166" y="${cy-18}" width="18" height="14" rx="3" fill="#cfe3f0" ${BO}/><rect x="216" y="${cy-18}" width="18" height="14" rx="3" fill="#cfe3f0" ${BO}/><path d="M160 ${cy-30} h80" stroke="${HW?"#f2a35c":"#f6a5b4"}" stroke-width="8" stroke-dasharray="10 10"/>`;
  if(HW)s+=jack(146,cy+16,.7)+jack(256,cy+18,.55);
  gates.forEach(g=>s+=gateSVG(g.x,Y(g.u),gateOpen(CHAP[g.i]),CHAP[g.i]));
  const e=way[way.length-1],ey=Y(e.u);
  s+=`<rect x="${e.x-4}" y="${ey-30}" width="8" height="40" fill="#c8946a" ${BO}/><path d="M${e.x-48} ${ey-56} H${e.x+40} L${e.x+52} ${ey-44} L${e.x+40} ${ey-32} H${e.x-48}Z" fill="#fffaf2" ${BO}/><text x="${e.x}" y="${ey-39}" text-anchor="middle" font-family="Mochiy Pop One,sans-serif" font-size="13" fill="${INK}">À suivre…</text>`;
  return `<svg viewBox="0 0 ${MW} ${H}" aria-hidden="true"><defs>${defs}</defs>${s}</svg>`;
}
let MAPL=null;
function renderMap(){
  const L=MAPL||(MAPL=mapLayout()),{P,gates,guests,H}=L,pc=(x,u)=>`left:${x/MW*100}%;top:${(H-u)/H*100}%`,cur=curDay();
  let h=mapSVG(L);
  for(let d=1;d<=LASTDAY;d++){
    const p=P[d],st=S.stars[d]||0,op=dayOpen(d),rk=Object.keys(REC).find(k=>REC[k].day===d);
    const cls=!op?"lock":d===cur&&!st?"cur":st===3?"gold":"done";
    const badge=rk&&!S.own[rk]?`<span class="nb">${icon(rk,chapOf(d).id)}</span>`:op&&st<3&&st?`<span class="nb">${icon("chest")}</span>`:"";
    h+=`<button class="node ${cls}" style="${pc(p.x,p.u)}" data-day="${d}" type="button" aria-label="Jour ${d}, ${st} étoile${st>1?"s":""}${op?"":", verrouillé"}"><b>${d}</b>${badge}<span class="nst">${[0,1,2].map(i=>`<i${i<st?' class="on"':""}>★</i>`).join("")}</span></button>`;
  }
  gates.forEach(g=>{const c=CHAP[g.i],op=gateOpen(c);h+=`<button class="gbtn${!op&&S.day>=c.from?" want":""}" style="${pc(g.x,g.u+44)}" data-gate="${g.i}" type="button" aria-label="Porte ${c.name} : ${c.gate} étoiles"></button>`});
  guests.forEach(g=>{const c=CHAP[g.i],ok=S.guest[c.guest];h+=`<button class="mguest${ok?" ok":""}" style="${pc(g.x,g.u)}" data-guest="${g.i}" type="button" aria-label="Invité d'honneur ${c.name}">${foxSVG(FOX[c.guest],{pose:ok?"happy":"sit",sil:!ok})}<em>${ok?FOX[c.guest].name:`${chapStars(c)}/30 ★`}</em></button>`});
  if(HW)h+=`<button class="mhw" style="${pc(322,104)}" data-act="hw" type="button" aria-label="Les nuits d'Halloween"><svg viewBox="0 0 90 70" aria-hidden="true"><g stroke="${INK}">${ghostie(66,40,.8)}${jack(36,66,1.25)}${jack(66,68,.7)}</g></svg><em>Nuits ${Object.values(S.hwStars).filter(x=>x).length} / 5</em></button>`;
  h+=`<div class="mfox" style="${pc(P[cur].x,P[cur].u)}">${foxSVG({...FOX.roussette,acc:styleOf("acc").id||undefined},{pose:"happy"})}</div>`;
  const w=$("mwrap");w.style.aspectRatio=`${MW}/${H}`;w.innerHTML=h;
  mapLabel();
}
function mapLabel(){
  if(!MAPL)return;const sc=$("mscroll"),w=$("mwrap"),H=MAPL.H;
  const u=H-(sc.scrollTop+sc.clientHeight/2)/w.offsetHeight*H,b=MAPL.bands.find(b=>u>=b.lo&&u<b.hi)||MAPL.bands[0];
  $("mchap").textContent=`${b.c.name} · ${chapStars(b.c)} / 30 ★`;$("mstars").textContent=`★ ${starSum()}`;
}
function openMap(){
  closeSheet();$("map").hidden=false;document.body.style.overflow="hidden";
  if(!G||!G.run){const se=chapOf(curDay()).id;if(se!==SEA){SEA=se;renderDecor();dirty=true}}
  renderMap();renderHud();
  const n=document.querySelector(".node.cur")||document.querySelector(`.node[data-day="${curDay()}"]`),sc=$("mscroll");
  sc.scrollTop=n.offsetTop-sc.clientHeight*.55;mapLabel();
  // présentation d'Halloween, une fois par an ; le bonus du jour attend la prochaine ouverture de la carte
  const yr=new Date().getFullYear();if(HW&&S.hwIntro!==yr){S.hwIntro=yr;save();hwSheet()}else dailyBonus();
}
function closeMap(){$("map").hidden=true;document.body.style.overflow=""}

/* ---------- effets ---------- */
let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function shake(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function rel(el){const r=$("scene").getBoundingClientRect(),b=el.getBoundingClientRect();return[b.left+b.width/2-r.left,b.top+b.height*.25-r.top]}
function floatAt(el,t,gold){if(!el)return;const [x,y]=rel(el),s=document.createElement("span");s.className="float"+(gold?" gold":"");s.textContent=t;s.style.left=x+"px";s.style.top=y+"px";$("scene").appendChild(s);setTimeout(()=>s.remove(),1200)}
function burst(el){const [x,y]=rel(el);for(let i=0;i<3;i++){const s=document.createElement("span");s.className="heart";s.textContent="♥";s.style.left=(x+(i-1)*14)+"px";s.style.top=y+"px";s.style.setProperty("--dx",((i-1)*16)+"px");s.style.animationDelay=(i*.1)+"s";$("scene").appendChild(s);setTimeout(()=>s.remove(),1500)}}

/* ---------- événements ---------- */
// Sur iPhone, le clic n'arrive qu'au relâcher et se perd si la tuile a été redessinée pendant l'appui :
// en jeu, on agit dès que le doigt touche l'écran (le clic clavier, detail 0, marche toujours).
function onTap(el,fn){el.addEventListener("pointerdown",e=>{if(e.button)return;fn(e)});el.addEventListener("click",e=>{if(e.detail===0)fn(e)})}
onTap($("custs"),e=>{const b=e.target.closest("[data-cust]");if(!b||!G||!G.run)return;const c=G.cust.find(x=>x.id==b.dataset.cust);if(c)deliver(c,b)});
onTap($("kitchen"),e=>{const b=e.target.closest("button");if(!b||!G||!G.run)return;
  if(b.dataset.st)tapStation(b.dataset.st,b);else if(b.dataset.bake)bake(b.dataset.bake);
  else if(b.dataset.oven!==undefined){if(G.oven.state==="ready")unload();else if(G.oven.state==="idle")hint("Touche une <b>pâtisserie</b> pour lancer une fournée.")}
  else if(b.dataset.pa){const k=b.dataset.pa;if(G.vit[k])fromVit(k,b);else if(G.oven.state==="idle")bake(k);else{shake(b);hint(G.oven.state==="ready"?"<b>Touche le four</b> pour sortir la fournée d'abord.":"Le four est occupé : attends la fin de la cuisson.")}}});
onTap($("tray"),e=>{const b=e.target.closest("[data-tray]");if(!b||!G||!G.run)return;const i=+b.dataset.tray,now=performance.now();
  if(G.arm&&G.arm.i===i&&G.arm.until>now){G.tray.splice(i,1);G.arm=null}
  else{G.arm={i,until:now+1800};setTimeout(()=>{dirty=true},1850);hint("Touche encore l'article pour le <b>jeter</b>.")}
  dirty=true});
$("back").onclick=()=>{if(G&&G.run)pauseMenu();else openMap()};
$("open-menu").onclick=openMap;
function onAct(a){
  if(a==="shop")shop();else if(a==="carnet")carnet();else if(a==="hw")hwSheet();else if(a==="costumes")costumesSheet();else if(a==="quests")questsSheet();
  else if(a==="map")openMap();
  else if(a==="resume"){closeSheet();G.paused=0}
  else if(a==="quit"){closeSheet();G=null;$("closed").hidden=false;$("hint").textContent="";dirty=true;save();openMap()}
}
$("map").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.day)daySheet(+b.dataset.day);else if(b.dataset.gate)gateSheet(+b.dataset.gate);else if(b.dataset.guest)guestSheet(+b.dataset.guest);else if(b.dataset.act)onAct(b.dataset.act);
});
$("mscroll").addEventListener("scroll",mapLabel,{passive:true});
$("sheet").addEventListener("click",e=>{
  if(e.target.id==="sheet"&&!$("sheet").dataset.lock){closeSheet();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.close!==undefined){closeSheet();return}
  if(b.dataset.tab){shopTab=b.dataset.tab;shop();return}
  if(b.dataset.boost){const id=b.dataset.boost;boostSel.has(id)?boostSel.delete(id):boostSel.add(id);const y=$("sheet-in").scrollTop;boostCtx();$("sheet-in").scrollTop=y;return}
  if(b.dataset.bbuy){const bo=BOOSTS.find(x=>x.id===b.dataset.bbuy);if(S.coins<bo.c)return;S.coins-=bo.c;S.boost[bo.id]=(S.boost[bo.id]||0)+1;save();renderHud();toast(`${bo.name} : +1 en réserve`);
    const y=$("sheet-in").scrollTop;if(boostCtx){boostSel.add(bo.id);boostCtx()}else shop();$("sheet-in").scrollTop=y;return}
  if(b.dataset.hwshop!==undefined){shopTab="hw";shop();return}
  if(b.dataset.night){nightSheet(+b.dataset.night);return}
  if(b.dataset.nplay){closeSheet();newNight(+b.dataset.nplay);return}
  if(b.dataset.buy){const id=b.dataset.buy,u=ALLUP.find(x=>x.id===id),n=lv(id),nx=u.lv[n];if(!nx||S.coins<nx.c||(nx.from&&S.day<nx.from))return;S.coins-=nx.c;S.own[id]=n+1;fillQuests();save();renderDecor();renderHud();renderKitchen();toast(n?`${u.name} : niveau ${n+1} !`:`${u.name} : acheté !`);shop.y=$("sheet-in").scrollTop;shop();return}
  if(b.dataset.sbuy||b.dataset.style){const [k,id]=(b.dataset.sbuy||b.dataset.style).split(":"),it=STYLE[k].items.find(x=>x.id===id),key=`st-${k}-${id}`;
    if(b.dataset.sbuy){if(it.cb){if(S.candy<it.cb)return;S.candy-=it.cb}else{if(S.coins<it.c)return;S.coins-=it.c}S.own[key]=1;toast(`${it.name} : acheté !`)}
    S.style=S.style||{};S.style[k]=id;save();renderDecor();renderHud();if(MAPL&&!$("map").hidden)renderMap();shop.y=$("sheet-in").scrollTop;shop();return}
  if(b.dataset.play){closeSheet();newDay(+b.dataset.play);return}
  if(b.dataset.day){daySheet(+b.dataset.day);return}
  if(b.dataset.act)onAct(b.dataset.act);
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&G.run&&!G.paused)pauseMenu()});

/* ---------- boucle ---------- */
function loop(ts){
  const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;
  if(G&&G.run&&!G.paused)update(dt);
  if(dirty)render();else if(G&&G.run)updateBars();
  requestAnimationFrame(loop);
}
$("ic-c").innerHTML=coinSVG;$("ic-c2").innerHTML=coinSVG;
if(HW)$("hwbtn").hidden=false;
SEA=chapOf(curDay()).id;renderDecor();render();requestAnimationFrame(loop);
openMap();

</script>
