<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6ece4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
.home{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fffaf2;border:2px solid #ead9cc;color:#5b4250;text-decoration:none;font:900 20px/1 system-ui;box-shadow:0 3px 0 #ead9cc;flex:none}</style>
<title>Kitsune Café</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/cafe.css">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  <filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</svg>
<div class="app">
  <header>
    <button class="back" id="back" type="button" aria-label="Pause ou carte"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#5b4250" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="hud" id="hud"></div>
    <div class="coin" title="Pièces"><span id="ic-c"></span><span id="coins">0</span></div>
    <button class="snd" data-sound type="button"></button>
  </header>
  <div class="scene" id="scene" role="group" aria-label="La salle du café">
    <div id="bgl"></div>
    <div id="custs"></div>
    <div id="counter"></div>
    <div id="helper"></div>
    <div class="chips" id="chips"></div>
    <div id="closed"><div class="closed-in"><span class="sign">Fermé</span><button class="btn big" id="open-menu" type="button">Voir la carte</button></div></div>
  </div>
  <div class="tray" id="tray"></div>
  <div class="kit" id="kitchen"></div>
  <p class="hint" id="hint"></p>
</div>
<div class="map" id="map" hidden>
  <div class="mtop"><a class="home" href="./" aria-label="Retour à l'accueil"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#5b4250" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="mtt"><b>Kitsune Café</b><span id="mchap"></span></div><span class="pill mst" id="mstars"></span><div class="coin" title="Pièces"><span id="ic-c2"></span><span id="coins2">0</span></div><button class="snd" data-sound type="button"></button></div>
  <div class="mscroll" id="mscroll"><div class="mwrap" id="mwrap"></div></div>
  <div class="mbar"><button class="btn ghost" data-act="shop" type="button">Boutique</button><button class="btn ghost" data-act="quests" type="button">Quêtes</button><button class="btn ghost" data-act="carnet" type="button">Carnet</button><button class="btn hw" id="hwbtn" data-act="hw" type="button" hidden>Halloween</button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast" hidden></div>
<!-- Le jeu est découpé en scripts classiques (pas de modules) : ils partagent la portée globale et se chargent dans cet ordre. -->
<script src="js/push.js"></script>
<script src="js/cloud.js"></script>
<script src="js/music.js"></script>
<script src="js/cafe/foxes.js"></script>
<script src="js/foxart.js"></script>
<script src="js/cafe/data.js"></script>
<script src="js/cafe/state.js"></script>
<script src="js/cafe/draw.js"></script>
<script src="js/cafe/game.js"></script>
<script src="js/cafe/render.js"></script>
<script src="js/cafe/end.js"></script>
<script src="js/cafe/menus.js"></script>
<script src="js/cafe/map.js"></script>
<script src="js/cafe/hwintro.js"></script>
<script src="js/cafe/main.js"></script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
