<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renard viking</title>
<style>
body{margin:0;padding:16px;background:#f6ece4;color:#5b4250;font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;opacity:.8}
.fox{background:#fffaf5;border:2px solid #ead9cf;border-radius:14px;padding:8px;margin-bottom:10px}
.fox strong{display:block;font-size:15px}
.fox em{display:block;font-style:normal;font-size:12px;opacity:.65;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}
.row figure{margin:0;width:96px;text-align:center}
.row svg{display:block;width:100%}
.row figcaption{font-size:11px;opacity:.6}
.row figure.pt svg{background:#f3e6dc;border:2px solid #ead9cf;border-radius:12px;box-sizing:border-box;width:80px;margin:0 auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</svg>
<h1>Le guerrier viking : trois propositions</h1>
<p>Petit casque à cornes et nasal, col de fourrure ; B ajoute un bouclier, C un bouclier et une épée de bois. Choisis la tenue et le pelage.</p>
<div id="out"></div>
<script src="../js/cafe/foxes.js"></script>
<script src="../js/foxart.js"></script>
<script>
const POSES=[["sit","assis"],["happy","content"],["walk","marche"],["eat","mange"],["groom","toilette"],["up","regarde en l'air"],["lie","allongé"],["sleep","dort"]];
const EXPR=[["open","normal"],["joy","joie"],["shy","timide"],["surprise","surpris"],["sad","triste"]];
const XF=[
  {id:"vk1",name:"A · Bjorn (casque et fourrure)",acc:"viking",bio:"Pelage roux foncé, barbe de fourrure : il raconte ses batailles contre les mouettes.",c:{b:"#d9764c",ch:"#fff3e2",e:"#6a2c1c",s:"#6a2c1c",t:"#fff3e2"}},
  {id:"vk2",name:"B · Sigrid (casque et bouclier)",acc:"vikingb",bio:"Gris acier, bouclier rouge : elle protège tout le monde, même ceux qui ne demandent rien.",c:{b:"#9aa3ad",ch:"#f4f6f8",e:"#4f5866",s:"#4f5866",t:"#f4f6f8"}},
  {id:"vk3",name:"C · Ragnar (casque, bouclier et épée de bois)",acc:"vikingc",bio:"Blond comme la paille, il brandit une épée en bois et a peur des papillons.",c:{b:"#f0c46a",ch:"#fffaf0",e:"#a9744a",s:"#a9744a",t:"#fffaf0"}}];
document.getElementById("out").innerHTML=XF.map(f=>`<div class="fox"><strong>${f.name}</strong><em>${f.bio||""}</em>
  <div class="row">${POSES.map(([p,n])=>`<figure>${foxArt(f,{pose:p})}<figcaption>${n}</figcaption></figure>`).join("")}</div>
  <div class="row">${EXPR.map(([e,n])=>`<figure class="pt">${foxArt(f,{portrait:1,expr:e})}<figcaption>${n}</figcaption></figure>`).join("")}<figure>${foxArt(f,{sil:1})}<figcaption>silhouette</figcaption></figure></div></div>`).join("");
</script>
</body>
</html>
