# Notifications du refuge : toutes les 30 min, envoie ce qui est prévu (tools/push-send.mjs).
# Secrets du dépôt : FIREBASE_SA (fichier JSON du compte de service Firebase) et VAPID_PRIVATE.
name: Notifications
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un essai à tous les téléphones, tout de suite"
        type: boolean
        default: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save web-push@3.6.7
      - run: node tools/push-send.mjs ${{ inputs.test && '--test' || '' }}
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
