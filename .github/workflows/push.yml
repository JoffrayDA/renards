# Notifications du refuge : envoie ce qui est prévu (tools/push-send.mjs).
# Secrets du dépôt : FIREBASE_SA (fichier JSON du compte de service Firebase) et VAPID_PRIVATE.
# GitHub ne tient pas un cron toutes les 30 min (le 29/10/2026 : 3 lancements en 15 h, rien pendant 4 h) :
# chaque lancement vérifie donc toutes les 5 min pendant près de 6 h, puis relance le suivant lui-même.
# Le cron toutes les 3 h ne sert qu'à repartir si la chaîne s'arrête (concurrency : un seul à la fois).
name: Notifications
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un essai à tous les téléphones, tout de suite"
        type: boolean
        default: false
concurrency:
  group: notifications-${{ inputs.test && 'test' || 'boucle' }}
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save web-push@3.6.7
      - name: Essai
        if: ${{ inputs.test }}
        run: node tools/push-send.mjs --test
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Envoi toutes les 5 min pendant 5 h 40
        if: ${{ !inputs.test }}
        run: |
          end=$((SECONDS+340*60))
          while [ $SECONDS -lt $end ]; do node tools/push-send.mjs --quiet || true; sleep 300; done
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Relance le suivant
        if: ${{ !inputs.test && !cancelled() }}
        run: gh workflow run push.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
