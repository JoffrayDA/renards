<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renards de Paris</title>
<style>
body{margin:0;padding:16px;background:#f6ece4;color:#5b4250;font:14px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;opacity:.8}
.fox{background:#fffaf5;border:2px solid #ead9cf;border-radius:14px;padding:8px;margin-bottom:10px}
.fox strong{display:block;font-size:15px}
.fox em{display:block;font-style:normal;font-size:12px;opacity:.65;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}
.row figure{margin:0;width:96px;text-align:center}
.row svg{display:block;width:100%}
.row figcaption{font-size:11px;opacity:.6}
.row figure.pt svg{background:#f3e6dc;border:2px solid #ead9cf;border-radius:12px;box-sizing:border-box;width:80px;margin:0 auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</svg>
<h1>Les renards de Paris</h1>
<p>Monde 2 du Café, quartier de Paris (maquette tools/paris.html). Toutes les poses, les portraits de dialogue et la silhouette.</p>
<div id="out"></div>
<script src="../js/cafe/foxes.js"></script>
<script src="../js/foxart.js"></script>
<script>
const POSES=[["sit","assis"],["happy","content"],["walk","marche"],["eat","mange"],["groom","toilette"],["up","regarde en l'air"],["lie","allongé"],["sleep","dort"]];
const EXPR=[["open","normal"],["joy","joie"],["shy","timide"],["surprise","surpris"],["sad","triste"]];
const XF=[
  {id:"pa1",name:"Anatole · le garçon de café",acc:"garconb",scale:.84,bio:"Il t'accueille et t'accompagne tout le long, comme Lorenzo en Italie. Gilet noir, nœud bordeaux, plateau et petit noir.",c:{b:"#e8955a",ch:"#fff4e6",e:"#8a4a2a",s:"#7a4028",t:"#fff4e6"}},
  {id:"pa2a",name:"Musette · l'accordéoniste",acc:"accordeon",bio:"Marinière, foulard rouge et accordéon. Elle joue sur les marches de Montmartre (et la polka de Paris, c'est elle).",c:{b:"#9ec3e0",ch:"#f6fbff",e:"#5a7a9a",s:"#4c6a8a",t:"#f6fbff"}},
  {id:"pa2b",name:"Bobine · le photographe",acc:"photographe",bio:"Casquette de gavroche et vieil appareil photo à l'épaule. Il prend tout le quartier en photo, clients compris.",c:{b:"#e6c08a",ch:"#fffaf0",e:"#a07a4a",s:"#8a6a3e",t:"#fffaf0"}},
  {id:"pa3",name:"Firmin · le boulanger rival",acc:"boulanger",bio:"Toque, tablier fariné, farine sur la joue et baguette sous le bras. « Le meilleur pain au chocolat de Paris, c'est le mien. »",c:{b:"#c7a07a",ch:"#fff8ee",e:"#7a5a3c",s:"#6a4c32",t:"#fff8ee"}},
  {id:"pa4",name:"Léon · le bouquiniste des quais",acc:"bouquiniste",bio:"Lunettes rondes dorées, écharpe à carreaux, toujours un livre ouvert. Il oublie de boire son café.",c:{b:"#8a8f9e",ch:"#f2f2f6",e:"#5a5e6a",s:"#4c505a",t:"#f2f2f6"}},
  {id:"pa5",name:"Céleste · la Diva de l'Opéra (légendaire)",acc:"diva",bio:"Diadème, collier de perles, boa de plumes et grain de beauté. Jurée de la finale du concours, puis invitée d'honneur.",c:{b:"#f4ead8",ch:"#ffffff",e:"#c9a86a",s:"#b8965a",t:"#ffffff"}}];
document.getElementById("out").innerHTML=XF.map(f=>`<div class="fox"><strong>${f.name}</strong><em>${f.bio||""}</em>
  <div class="row">${POSES.map(([p,n])=>`<figure>${foxArt(f,{pose:p})}<figcaption>${n}</figcaption></figure>`).join("")}</div>
  <div class="row">${EXPR.map(([e,n])=>`<figure class="pt">${foxArt(f,{portrait:1,expr:e})}<figcaption>${n}</figcaption></figure>`).join("")}<figure>${foxArt(f,{sil:1})}<figcaption>silhouette</figcaption></figure></div></div>`).join("");
</script>
</body>
</html>
