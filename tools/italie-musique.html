<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musiques de la Petite Italie</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#5b4250;--bg:#f6f1ea;--card:#fffaf2;--acc:#3f9a6a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;padding:16px}
h1{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:22px;margin:8px 0 4px}
p{margin:0 0 14px;line-height:1.45}
.list{display:grid;gap:10px;max-width:520px}
button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2.4px solid var(--ink);border-radius:18px;padding:12px 14px;cursor:pointer}
button b{display:block;font-size:16px}button span{font-size:13px;opacity:.8}
button i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
button.on{background:#e4f4ea}
.stop{justify-content:center;max-width:520px;margin-top:10px}
</style></head><body>
<h1>Musiques de la Petite Italie</h1>
<p>Touche une musique pour l'écouter. Elles tournent en boucle. Toutes les mélodies sont originales. Dis-moi le numéro que tu veux pour la carte et pour le service.</p>
<div class="list">
<p style="margin:4px 0 0"><b>Pour la carte</b> (calme)</p>
<button data-t="piazza"><i>1</i><div><b>Valse de la piazza</b><span>Celle du jeu en ce moment. Valse de terrasse, mandoline et accordéon.</span></div></button>
<button data-t="barcarola"><i>2</i><div><b>Barcarolle du canal</b><span>Nouvelle. La gondole qui berce : accordéon chanté, harpe, plus mélancolique.</span></div></button>
<button data-t="vespa"><i>3</i><div><b>Swing en Vespa</b><span>Nouvelle. Petit swing des années 50, contrebasse qui marche, mandoline.</span></div></button>
<button data-t="ukulele"><i>4</i><div><b>Pique-nique ukulélé</b><span>La musique du premier café, pour comparer.</span></div></button>
<p style="margin:10px 0 0"><b>Pour le service</b> (rapide)</p>
<button data-t="tarantella"><i>5</i><div><b>Tarentelle du Caffè</b><span>Celle du jeu en ce moment. Tarentelle en 6/8, tambourin.</span></div></button>
<button data-t="polka"><i>6</i><div><b>Polka du cornetto</b><span>Nouvelle. Oum-pa bien carré, mandoline et clochettes, très guillerette.</span></div></button>
<button data-t="service"><i>7</i><div><b>Coup de feu</b><span>La musique du service du premier café, pour comparer.</span></div></button>
</div>
<button class="stop" data-t="">Arrêter</button>
<script src="../js/music.js"></script>
<script>
document.querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>{MUSIC.setOn(true);const t=b.dataset.t;
  document.querySelectorAll("button[data-t]").forEach(x=>x.classList.toggle("on",x===b&&!!t));if(t)MUSIC.want(t);else MUSIC.stop()});
</script>
</body></html>
