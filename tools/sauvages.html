<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renards sauvages</title>
<style>
body{margin:0;padding:16px;background:#f6ece4;color:#5b4250;font:14px system-ui,sans-serif}
h1{font-size:19px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 8px}p{margin:0 0 12px;opacity:.8}
.fox{background:#fffaf5;border:2px solid #ead9cf;border-radius:14px;padding:8px;margin-bottom:10px}
.fox strong{font-size:15px}.fox em{display:block;font-style:normal;font-size:12px;opacity:.7;margin:2px 0 4px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}.row figure{margin:0;width:88px;text-align:center}.row svg{display:block;width:100%}
.row figcaption{font-size:11px;opacity:.6}.row figure.pt svg{background:#f3e6dc;border:2px solid #ead9cf;border-radius:12px;box-sizing:border-box;width:76px;margin:0 auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</svg>
<h1>Tous les renards sauvages</h1>
<p>Les inconnus de la forêt (à deviner) et les sauvages de la gamelle, tels qu'ils sont dans le jeu.</p>
<div id="out"></div>
<script src="../js/bourse.js"></script>
<script src="../js/cafe/foxes.js"></script>
<script src="../js/foxart.js"></script>
<script>const R={inco:{},photos:[],res:{}},today=()=>"";</script>
<script src="../js/clairiere/sauvages.js"></script>
<script>
const POSES=[["sit","assis"],["happy","content"],["eat","mange"],["groom","toilette"],["lie","allongé"],["sleep","dort"]];
const card=(f,sub)=>`<div class="fox"><strong>${f.name}</strong><em>${sub}</em><div class="row">${POSES.map(([p,n])=>`<figure>${foxArt(f,{pose:p})}<figcaption>${n}</figcaption></figure>`).join("")}<figure class="pt">${foxArt(f,{portrait:1,expr:"joy"})}<figcaption>portrait</figcaption></figure></div></div>`;
const lot=f=>f.near?"lot 3, attiré par "+f.near:["balafre","miette","panache","mure","filou","radar"].includes(f.id)?"lot 1":"lot 2";
document.getElementById("out").innerHTML=`<h2>Les inconnus de la forêt (${INCO.length})</h2>`+INCO.map(f=>card(f,`${lot(f)} · ${f.bio}`)).join("")
  +`<h2>Les sauvages de la gamelle (6)</h2>`+["somnus","reglisse","aurore","maree","perle","yeti"].map(id=>card(FOX[id],FOX[id].bio||"")).join("");
</script>
</body>
</html>
