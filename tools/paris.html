<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--ink:#5b4250;--cream:#fffaf5;--line:#ead9cf}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f6ece4;color:var(--ink);font:500 14px "Zen Maru Gothic",system-ui,sans-serif}
h1,h2,.ttl{font-family:"Mochiy Pop One",sans-serif;font-weight:400}
h1{font-size:20px;margin:0 0 4px}
.intro{margin:0 0 16px;max-width:760px;opacity:.85}
.wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{width:360px;max-width:100%}
.col>h2{font-size:15px;margin:0 0 8px}
.phone{background:#fdf6ee;border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 6px 0 #e3cfc2}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--cream);border-bottom:2px solid var(--line)}
.back{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}
.bar .ttl{font-size:16px;line-height:1.1}
.bar small{display:block;font-size:11px;opacity:.7;font-family:"Zen Maru Gothic"}
.pill{margin-left:auto;padding:4px 10px;border-radius:99px;background:#ffe7a8;border:2px solid #f0cf72;font-weight:900;font-size:13px}
.pill+.pill{margin-left:0;background:#fff;border-color:var(--line)}
.map svg{display:block;width:100%;height:auto}
.btns{display:flex;gap:8px;padding:10px;background:var(--cream);border-top:2px solid var(--line)}
.btns span{flex:1;text-align:center;padding:9px 0;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:900}
.room{position:relative;margin:10px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;aspect-ratio:7/5}
.room>svg{position:absolute;inset:0;width:100%;height:100%}
.cu{position:absolute;bottom:22%;width:24%;transform:translateX(-50%)}
.cu svg{display:block;width:100%}
.bub{position:absolute;left:50%;bottom:86%;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:2px 5px;display:flex;gap:1px}
.bub svg{width:30px;height:28px}
.pat{position:absolute;left:18%;right:18%;bottom:-8px;height:6px;border-radius:9px;background:#eee;border:1.5px solid var(--ink);overflow:hidden}
.pat i{display:block;height:100%;background:#8fd18a}
.clients{position:absolute;left:8px;bottom:8px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:900}
.duel{position:absolute;right:8px;top:8px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:900;display:flex;gap:6px;align-items:center}
.duel em{font-style:normal;color:#c0485a}
.tray{display:flex;gap:6px;align-items:center;margin:0 10px;padding:8px;background:#fff;border:2px solid var(--line);border-radius:16px}
.slot{width:46px;height:46px;border-radius:12px;border:2px dashed #e6d3c4;background:#fbf3ea;display:grid;place-items:center}
.slot.f{border:2px solid var(--ink);background:#fff}
.slot svg{width:38px}
.opt{margin-left:auto;display:flex;gap:6px}
.opt span{width:50px;height:50px;border-radius:50%;background:#e9f3fb;border:2px solid #b9d6ee;display:grid;place-items:center;font-size:10px;font-weight:900;text-align:center;line-height:1}
.opt svg{width:26px;display:block;margin:0 auto}
.tiles{display:grid;gap:8px;margin:8px 10px 0}
.tiles:last-child{margin-bottom:12px}
.t3{grid-template-columns:1fr 1fr 1fr}.t4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 2px 6px;text-align:center;font-weight:900;font-size:11.5px;box-shadow:0 3px 0 #ecdcd0}
.tile svg{width:42px;height:38px;display:block;margin:0 auto 2px}
.tile .bar2{height:6px;margin:4px 12px 0;border-radius:9px;background:#f0e4da;overflow:hidden}
.tile .bar2 i{display:block;height:100%;background:#f3b06a}
.tile .n{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center}
.tile.box{border:2px dashed #e6c3cf;background:#fff6f8}
.card{background:var(--cream);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px}
.card p{margin:4px 0}
.card ul{margin:4px 0;padding-left:18px}
.rec{display:grid;grid-template-columns:44px 1fr;gap:4px 8px;align-items:center}
.rec svg{width:42px;height:38px}
.rec b{display:block}
.rec span{font-size:12px;opacity:.75}
.choice{display:flex;gap:10px;margin:6px 0}
.choice div{flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-weight:900}
.choice svg{width:60px;height:56px;display:block;margin:0 auto}
.foxes{display:flex;flex-wrap:wrap;gap:8px}
.fx{width:150px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.fx svg{width:96px;display:block;margin:0 auto}
.fx b{display:block}.fx span{font-size:11.5px;opacity:.75;display:block}
.tag{display:inline-block;font-size:10px;font-weight:900;padding:0 6px;border-radius:6px;background:#f3e6dc;margin-bottom:2px}
.tag.l{background:#ffd36a}.tag.r{background:#f6c3c9}
@media (max-width:420px){body{padding:10px}.col{width:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</svg>
<h1>Monde 2 · Paris (maquette)</h1>
<p class="intro">Deuxième quartier de la Ville, à comparer avec la Petite Italie. Rien n'est jouable : c'est pour valider la carte, la salle, la carte des recettes et l'histoire (le grand concours du pain au chocolat).</p>
<div class="wrap">
  <div class="col"><h2>La carte</h2><div class="phone map" id="map"></div></div>
  <div class="col"><h2>Une journée (jour 5, un jour de défi)</h2><div class="phone" id="day"></div></div>
  <div class="col" id="info"></div>
</div>
<script src="../js/cafe/foxes.js"></script>
<script src="../js/foxart.js"></script>
<script>
const K=`stroke="${INK}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`,K2=`stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;
/* ---------- les recettes de Paris (mêmes clés que le Café : prix, cuisson et équilibrage identiques) ---------- */
const MAC={f:["Framboise","#f49ab0"],v:["Violette","#b99ad8"],c:["Caramel","#eab765"]};
const macaron=(x,y,c,k=1)=>`<ellipse cx="${x}" cy="${y-4*k}" rx="${9*k}" ry="${4.6*k}" fill="${c}" ${K2}/><rect x="${x-8*k}" y="${y-2*k}" width="${16*k}" height="${3.6*k}" rx="${1.6*k}" fill="#fff8ec" ${K2}/><ellipse cx="${x}" cy="${y+4.4*k}" rx="${9*k}" ry="${4.6*k}" fill="${c}" ${K2}/><ellipse cx="${x-3*k}" cy="${y-6*k}" rx="${2.4*k}" ry="${1*k}" fill="#fff" opacity=".7"/>`;
const glass=(liq,top)=>`<path d="M11 8 H29 L27 35 H13Z" fill="#eef7fb" ${K}/><path d="M12.2 15 H27.8 L26.6 33.5 H13.4Z" fill="${liq}"/>${top||""}<rect x="15" y="17" width="6" height="6" rx="1.5" fill="#fff" opacity=".75" transform="rotate(-12 18 20)"/><rect x="21" y="23" width="5.5" height="5.5" rx="1.5" fill="#fff" opacity=".7" transform="rotate(10 23 25)"/><path d="M11 8 H29 L27 35 H13Z" fill="none" ${K}/>`;
const IC={
  petitnoir:`<ellipse cx="20" cy="31" rx="14" ry="3.4" fill="#fff" ${K}/><path d="M29 19 Q35 19 34 23 Q33 27 28 26" fill="none" ${K}/><path d="M10 16 H30 Q30 30 20 30 Q10 30 10 16Z" fill="#fff" ${K}/><ellipse cx="20" cy="16" rx="10" ry="2.6" fill="#4a2a1c" ${K}/><path d="M17 10 q-2 -3 0 -6 M23 10 q-2 -3 0 -6" fill="none" stroke="#c9b3a8" stroke-width="1.8" stroke-linecap="round"/><path d="M33 33 h3" ${K}/><rect x="31" y="27" width="5" height="4" rx="1" fill="#fff" ${K2}/>`,
  creme:`<ellipse cx="20" cy="32" rx="16" ry="3.6" fill="#fff" ${K}/><path d="M31 17 Q38 17 37 22 Q36 27 30 26" fill="none" ${K}/><path d="M5 14 H32 Q32 31 18.5 31 Q5 31 5 14Z" fill="#fff" ${K}/><path d="M6 20 H31" stroke="#5b8ac0" stroke-width="2.2"/><ellipse cx="18.5" cy="14" rx="13.5" ry="3.2" fill="#e9c9a0" ${K}/><path d="M13 13.6 q5.5 -2.4 11 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
  pac:`<rect x="5" y="12" width="30" height="18" rx="6" fill="#eaa85a" ${K}/><path d="M9 14 Q20 10 31 14" fill="none" stroke="#f7cd8a" stroke-width="2.4" stroke-linecap="round"/><path d="M8 20 H32 M8 25 H32" stroke="#c98140" stroke-width="1.6"/><rect x="2.6" y="16.5" width="6" height="4.6" rx="2" fill="#5a3324" ${K2}/><rect x="31.4" y="16.5" width="6" height="4.6" rx="2" fill="#5a3324" ${K2}/><rect x="3" y="22.6" width="5.4" height="4.2" rx="2" fill="#5a3324" ${K2}/><rect x="31.6" y="22.6" width="5.4" height="4.2" rx="2" fill="#5a3324" ${K2}/>`,
  madeleine:`<path d="M5 25 Q6 9 20 8 Q34 9 35 25 Q31 31 20 31 Q9 31 5 25Z" fill="#f2c27a" ${K}/><path d="M20 30 V11 M13 29 Q12 18 16 11 M27 29 Q28 18 24 11 M8 26 Q8 19 12 14 M32 26 Q32 19 28 14" fill="none" stroke="#d99a4a" stroke-width="1.6" stroke-linecap="round"/><path d="M12 9.5 Q16 8 18 8.4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>`,
  eclair:`<rect x="4" y="15" width="32" height="14" rx="7" fill="#eab06e" ${K}/><path d="M6 19 Q6 13 12 13 H28 Q34 13 34 19 Q34 21 32 21 H8 Q6 21 6 19Z" fill="#6b3f2a" ${K}/><path d="M11 15.4 H22" stroke="#a87458" stroke-width="1.8" stroke-linecap="round"/><path d="M8 25 Q20 27 32 25" stroke="#c98a45" stroke-width="1.4" fill="none"/>`,
  diabolo:glass("#8fd8a0",`<path d="M24 2 L21 26" ${K} stroke="#f47f9a"/><circle cx="28" cy="9" r="4" fill="#bfe6a8" ${K2}/><path d="M28 5.5 V12.5" stroke="#8cc47a" stroke-width="1.1"/>`),
  grenadine:glass("#f2707e",`<path d="M24 2 L21 26" ${K} stroke="#7fc4e0"/><circle cx="28" cy="9" r="4" fill="#ffe36a" ${K2}/><path d="M28 5.5 V12.5" stroke="#f2c94a" stroke-width="1.1"/>`),
  liegeois:`<path d="M12 12 H28 L26.5 35 H13.5Z" fill="#eef7fb" ${K}/><path d="M12.6 21 H27.4 L26.5 34 H13.5Z" fill="#8a5a3a"/><path d="M12.8 18 H27.2 L27 21 H13Z" fill="#c99a70"/><path d="M12 12 H28 L26.5 35 H13.5Z" fill="none" ${K}/><path d="M26 14 L31 3" ${K}/><ellipse cx="31.4" cy="2.6" rx="2" ry="1.2" fill="#fff" ${K2}/>`,
  four:`<rect x="5" y="7" width="30" height="26" rx="6" fill="#9fb9d8" ${K}/><rect x="10" y="13" width="20" height="13" rx="3" fill="#fff3e2" ${K}/><circle cx="16" cy="19" r="1.4" fill="${INK}"/><circle cx="24" cy="19" r="1.4" fill="${INK}"/><path d="M18 22 q2 2 4 0" fill="none" stroke="${INK}" stroke-width="1.4"/><circle cx="12" cy="29.5" r="1.4" fill="${INK}"/><circle cx="28" cy="29.5" r="1.4" fill="${INK}"/>`,
  lait:`<path d="M12 10 H26 L28 16 V32 Q28 34 26 34 H12 Q10 34 10 32 V16Z" fill="#fff" ${K}/><path d="M12 10 L10 6 H24 L26 10" fill="#fff" ${K}/><path d="M28 18 Q34 18 33 24 Q32 28 28 28" fill="none" ${K}/><path d="M11 22 H27" stroke="#5b8ac0" stroke-width="2"/>`,
  chantilly:`<path d="M10 30 Q6 24 12 22 Q8 16 15 14 Q14 7 21 7 Q28 7 26 14 Q33 15 29 22 Q35 24 30 30Z" fill="#fffaf0" ${K}/><path d="M15 20 q5 -3 10 0 M14 26 q6 -3 12 0" stroke="#e6d3c4" stroke-width="1.6" fill="none"/>`,
  boite:`<path d="M3 15 H37 V31 Q37 34 34 34 H6 Q3 34 3 31Z" fill="#fff" ${K}/><path d="M3 15 L7 9 H33 L37 15" fill="#cfe3f1" ${K}/>${macaron(11,24,MAC.f[1],.82)}${macaron(20,24,MAC.v[1],.82)}${macaron(29,24,MAC.c[1],.82)}`,
};
IC.liegeois=IC.liegeois.replace(`<path d="M12 12 H28`,`<path d="M11 12 Q12 4 20 5 Q28 4 29 12Z" fill="#fffaf0" ${K}/><path d="M12 12 H28`);
const box=(o,done=3)=>`<path d="M2 14 H38 V31 Q38 34 35 34 H5 Q2 34 2 31Z" fill="#fff" ${K}/>${o.split("").map((m,i)=>i<done?macaron(10+i*10,24,MAC[m][1],.8):`<circle cx="${10+i*10}" cy="24" r="4.4" fill="none" stroke="#e6c3cf" stroke-width="1.4" stroke-dasharray="2 2"/>`).join("")}`;
const ic=(k,w=40,h=38)=>`<svg viewBox="0 0 40 38" width="${w}" height="${h}" aria-hidden="true"><g filter="url(#wobble)">${IC[k]||k}</g></svg>`;
const RECS=[["cafe","petitnoir","Petit noir","Le café serré du comptoir. Avec l'option Lait : un café crème."],["croissant","pac","Pain au chocolat","Le vrai, avec ses deux barres de chocolat. Le croissant reste celui des 40 premiers niveaux."],["the","grenadine","Diabolo grenadine","Sirop de grenadine, limonade et glaçons (choix de Joffray)."],["cookie","madeleine","Madeleine","Petite, dorée, en coquille (fournées de 4)."],["choco","liegeois","Café liégeois","Café glacé dans un grand verre : avec l'option Chantilly, le chapeau de crème. Remplace le chocolat chaud."],["smoothie","boite","Boîte de macarons","La spécialité : trois macarons dans l'ordre du client (comme le gelato)."],["gateau","eclair","Éclair","Le plus cher de la carte, au chocolat. Avec l'option Chantilly : éclair à la chantilly."]];

/* ---------- les renards du quartier (accessoires dans js/foxart.js, planche tools/parisiens.html) ---------- */
const LOC=[
  {id:"pa1",name:"Anatole",rar:"commun",acc:"garconb",scale:.84,c:{b:"#e8955a",ch:"#fff4e6",e:"#8a4a2a",s:"#7a4028",t:"#fff4e6"},bio:"Le garçon de café. Il t'accueille et t'accompagne tout le long, comme Lorenzo."},
  {id:"pa2",name:"Musette",rar:"commun",acc:"accordeon",c:{b:"#9ec3e0",ch:"#f6fbff",e:"#5a7a9a",s:"#4c6a8a",t:"#f6fbff"},bio:"L'accordéoniste en marinière. Elle joue sur les marches de Montmartre."},
  {id:"pa6",name:"Bobine",rar:"commun",acc:"photographe",c:{b:"#e6c08a",ch:"#fffaf0",e:"#a07a4a",s:"#8a6a3e",t:"#fffaf0"},bio:"Le photographe à casquette de gavroche. Il prend tout le quartier en photo, clients compris."},
  {id:"pa3",name:"Firmin",rar:"discret",acc:"boulanger",c:{b:"#c7a07a",ch:"#fff8ee",e:"#7a5a3c",s:"#6a4c32",t:"#fff8ee"},bio:"Le boulanger d'en face. « Le meilleur pain au chocolat de Paris, c'est le mien. » Le rival."},
  {id:"pa4",name:"Léon",rar:"discret",acc:"bouquiniste",c:{b:"#8a8f9e",ch:"#f2f2f6",e:"#5a5e6a",s:"#4c505a",t:"#f2f2f6"},bio:"Bouquiniste sur les quais. Lit en attendant sa commande, et oublie de la boire."},
  {id:"pa5",name:"Céleste",rar:"legend",acc:"diva",c:{b:"#f4ead8",ch:"#ffffff",e:"#c9a86a",s:"#b8965a",t:"#ffffff"},bio:"La Diva de l'Opéra. Jurée de la finale du concours, puis invitée d'honneur."}
];
const fx=(f,o)=>foxArt(f,o||{});
const inner=svg=>svg.replace(/^<svg[^>]*>|<\/svg>$/g,"");

/* ---------- la carte ---------- */
function mapSVG(){
  const W=400,H=1240;
  const P=[[200,1150],[116,1108],[112,1046],[204,1010],[296,972],[300,912],[300,776],[206,744],[116,708],[104,642],[186,606],[262,566],[226,512],[300,476],[306,412],[226,380],[290,330],[214,286],[134,256],[200,214]];
  let d="",s="";
  d+=`<pattern id="cob" width="44" height="30" patternUnits="userSpaceOnUse"><rect width="44" height="30" fill="#eee5da"/><g fill="none" stroke="#ddd0c0" stroke-width="2"><rect x="2" y="2" width="18" height="11" rx="5"/><rect x="24" y="2" width="18" height="11" rx="5"/><rect x="-9" y="17" width="18" height="11" rx="5"/><rect x="13" y="17" width="18" height="11" rx="5"/><rect x="35" y="17" width="18" height="11" rx="5"/></g></pattern>`;
  d+=`<linearGradient id="seine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d6e6"/><stop offset="1" stop-color="#7fb8d2"/></linearGradient>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#cob)"/>`;
  // les pelouses : le Champ-de-Mars sous la tour, la butte Montmartre
  s+=`<path d="M250 760 Q330 742 410 756 V560 Q340 548 268 572Z" fill="#c4e0a4" ${K}/><path d="M-10 486 Q20 330 120 300 Q190 290 222 330 Q252 380 250 470 Q170 500 -10 486Z" fill="#b9d99a" ${K}/>`;
  // la Seine en travers, ses quais de pierre
  s+=`<path d="M-10 808 Q100 798 200 806 T410 802 V818 H-10Z" fill="#e3d6c2" ${K}/><path d="M-10 818 Q100 812 200 820 T410 816 V880 Q300 890 200 882 T-10 886Z" fill="url(#seine)" ${K}/><path d="M-10 886 Q100 880 200 884 T410 880 V898 H-10Z" fill="#e3d6c2" ${K}/>`;
  s+=[[230,834],[360,872],[40,872],[300,846]].map(([x,y])=>`<path d="M${x} ${y} q8 -4 16 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`).join("");
  // un immeuble haussmannien : pierre crème, toit en zinc avec lucarnes, balcons en fer forgé, boutique en bas
  const haus=(x,y,w,h,shop="#c0485a")=>{let g=`<path d="M${x-3} ${y} L${x+7} ${y-22} H${x+w-7} L${x+w+3} ${y}Z" fill="#a9b6c6" ${K}/>`;
    for(let i=0;i<Math.floor((w-10)/22);i++)g+=`<rect x="${x+12+i*22}" y="${y-17}" width="9" height="11" rx="4" fill="#e6eef6" ${K2}/>`;
    g+=`<rect x="${x+w-18}" y="${y-30}" width="8" height="10" fill="#d98a6a" ${K2}/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#f6e8d0" ${K}/>`;
    for(let i=0;i<Math.floor((w-6)/22);i++){const wx=x+8+i*22;for(let j=0;j<Math.floor((h-26)/26);j++){const wy=y+8+j*26;g+=`<rect x="${wx}" y="${wy}" width="11" height="17" rx="2" fill="#bcd8ea" ${K2}/>`;if(j===0)g+=`<path d="M${wx-2} ${wy+12} H${wx+13} M${wx+1} ${wy+12} V${wy+17} M${wx+5.5} ${wy+12} V${wy+17} M${wx+10} ${wy+12} V${wy+17}" stroke="${INK}" stroke-width="1.3"/>`}}
    g+=`<path d="M${x} ${y+h-22} H${x+w}" stroke="${INK}" stroke-width="2"/><rect x="${x+4}" y="${y+h-18}" width="${w-8}" height="18" fill="${shop}" opacity=".85" ${K2}/>`;
    for(let i=0;i<Math.floor((w-8)/10);i++)g+=`<path d="M${x+4+i*10} ${y+h-22} h5 v6 h-5Z" fill="#fff"/>`;return g};

  s+=[[18,214],[350,214]].map(([x,y])=>`<rect x="${x}" y="${y+22}" width="52" height="5" rx="2" fill="#a8664a" stroke="${INK}" stroke-width="1.8"/><path d="M${x+6} ${y+22} V${y+6} Q${x+10} ${y} ${x+14} ${y+6} V${y+22}Z" fill="#8fd8a0" stroke="${INK}" stroke-width="1.8"/><path d="M${x+20} ${y+22} V${y+6} Q${x+24} ${y} ${x+28} ${y+6} V${y+22}Z" fill="#f2707e" stroke="${INK}" stroke-width="1.8"/><rect x="${x+33}" y="${y+8}" width="14" height="14" rx="3" fill="#fff" stroke="${INK}" stroke-width="1.8"/>${macaron(x+40,y+15,"#b99ad8",.55)}`).join("");
  s+=`<rect x="-4" y="226" width="428" height="14" rx="4" fill="#cfd6de" stroke="${INK}" stroke-width="2.6"/><path d="M30 231 H120 M220 233 H300" stroke="#eef2f6" stroke-width="2" stroke-linecap="round"/><rect x="0" y="240" width="420" height="62" fill="#8a5a44" stroke="${INK}" stroke-width="2.4"/>`+[0,1,2,3,4,5].map(i=>`<rect x="${10+i*70}" y="250" width="56" height="42" rx="6" fill="#9c6a52" stroke="${INK}" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 420 300" preserveAspectRatio="xMidYMid slice"><g filter="url(#wobble)">${s}</g></svg>`;
}
