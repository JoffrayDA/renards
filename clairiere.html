<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6ece4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
.home{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fffaf2;border:2px solid #ead9cc;color:#5b4250;text-decoration:none;font:900 20px/1 system-ui;box-shadow:0 3px 0 #ead9cc;flex:none}</style>
<title>La Clairière · Kitsune Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/clairiere.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
</svg>

<div class="app">
  <header>
    <div class="brand"><a class="home" href="./" aria-label="Retour à l'accueil"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="#5b4250" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a><span id="logo"></span><h1>La <span>Clairière</span></h1></div>
    <div class="purse">
      <div class="coin" title="Glands"><span id="ic-g"></span><span id="glands">0</span></div>
      <button class="snd" data-sound type="button"></button>
    </div>
  </header>

  <div class="scene" id="scene" role="group" aria-label="Le refuge de Roussette">
    <svg id="bg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="layer" id="actors"></div>
    <div class="layer" id="tint"></div>
    <svg class="layer" id="glow" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="layer" id="lights"></div>
    <canvas class="layer" id="rain"></canvas>
    <div class="pill" id="phase"></div>
    <div class="talk" id="talk" role="button" tabindex="0" hidden></div>
    <div class="play" id="play" hidden></div>
  </div>
  <button class="goal" id="goal" type="button" hidden></button>
  <p id="log" aria-live="polite"></p>
  <div class="actions">
    <button class="btn big" id="b-bowl" type="button">Gamelle</button>
    <button class="btn big ghost" id="b-carnet" type="button">Carnet</button>
    <button class="btn big ghost" id="b-photos" type="button">Photos</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="js/cafe/foxes.js"></script>
<script src="js/foxart.js"></script>
<script src="js/clairiere/data.js"></script>
<script src="js/clairiere/state.js"></script>
<script src="js/clairiere/scene.js"></script>
<script src="js/clairiere/life.js"></script>
<script src="js/clairiere/ui.js"></script>
<script src="js/clairiere/games.js"></script>
<script src="js/clairiere/story.js"></script>
<script src="js/clairiere/main.js"></script>
<script src="js/music.js"></script>
<script>MUSIC.want("foret")</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
